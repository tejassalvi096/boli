<script>
/* ---------- Creator report: public profile, in-app creator page (part_kit) ---------- */
function kArr(x){ return Array.isArray(x) ? x : []; }
function kStr(x){ return String(x==null ? '' : x).trim(); }
function kInt(x){ const n = Number(x); return x!=null && x!=='' && isFinite(n) && n>=0 ? Math.round(n) : null; }
function kObj(r){ let d = r && !r.error ? r.data : null; if(Array.isArray(d)) d = d[0]; return d && typeof d==='object' && d.id ? d : null; }
function kKey(k){ return kStr(k.handle) || kStr(k.id); }
function kLink(k){ return location.origin + '/#/c/' + encodeURIComponent(kKey(k)); }
function kFirst(name){ return kStr(name).split(/\s+/)[0] || 'this creator'; }
function kViewer(k){
  if(!S.user || !S.me) return 'visitor';
  if(k && S.me.id===k.id) return 'self';
  if(isBrand()) return 'brand';
  if(S.me.is_admin) return 'admin';
  return 'creator';
}
function kPlatform(u){
  let h = ''; try{ h = new URL(u).hostname.replace(/^www\./,'').toLowerCase(); }catch(e){}
  return /(^|\.)instagram\.com$/.test(h) ? 'Instagram' : /(^|\.)(youtube\.com|youtu\.be)$/.test(h) ? 'YouTube' : /(^|\.)drive\.google\.com$/.test(h) ? 'Google Drive' : 'Video';
}
function kYtId(u){
  try{
    const x = new URL(u), h = x.hostname.replace(/^www\./,'').toLowerCase(); let id = '';
    if(h==='youtu.be') id = x.pathname.split('/')[1] || '';
    else if(/(^|\.)youtube\.com$/.test(h)){ if(x.pathname.startsWith('/shorts/')) id = x.pathname.split('/')[2] || ''; else if(x.pathname==='/watch') id = x.searchParams.get('v') || ''; }
    return /^[A-Za-z0-9_-]{6,20}$/.test(id) ? id : '';
  }catch(e){ return ''; }
}
function kSamples(k){
  return kArr(k && k.samples).filter(s=>s && url(kStr(s.url)) && /^https?:\/\/[^\s"'<>`]+$/i.test(kStr(s.url))).slice(0, 6).map((s, i)=>({
    url: kStr(s.url), title: kStr(s.title) || 'Sample ' + (i+1), views: kInt(s.views), likes: kInt(s.likes)}));
}
/* Builds a report object from a plain profile row, for when the public_profile function is not available. */
function kFromProfile(c, sample){
  const st = (S.stats || {})[c.id] || {};
  return {id:c.id, handle:c.handle||null, name:c.name, city:c.city, area:c.area, local_focus:c.local_focus, langs:c.langs, cats:c.cats, deals:c.deals, bio:c.bio,
    followers:c.followers, verified:!!c.verified, rate:c.rate||null, show_rate:true, public_on:!!c.public_on, created_at:c.created_at,
    stats:{done:st.done||0, brands:st.brands||0, first_try:null, brand_cats:[]}, samples: url(sample) ? [{url:sample}] : []};
}
function kTile(big, label, small, cls){ return `<div class="k-tile${cls?' '+cls:''}"><b>${big}</b><span>${label}</span>${small?`<small>${small}</small>`:''}</div>`; }
function kitHTML(k, opts){
  if(!k || typeof k!=='object') return '';
  const cats = kArr(k.cats), langs = kArr(k.langs), deals = kArr(k.deals), st = k.stats && typeof k.stats==='object' ? k.stats : {};
  const place = [k.city, k.area].map(kStr).filter(Boolean).join(' · '), local = kStr(k.local_focus), bio = kStr(k.bio);
  const done = kInt(st.done) || 0, brands = kInt(st.brands) || 0, first = kInt(st.first_try), rate = kInt(k.rate);
  let since = ''; try{ const d = new Date(k.created_at); if(/^\d{4}-\d{2}-\d{2}/.test(kStr(k.created_at)) && !isNaN(d)) since = d.toLocaleDateString('en-IN', {month:'short', year:'numeric'}); }catch(e){}
  const tiles = [kTile(num(kInt(k.followers) || 0), 'Followers', k.verified ? 'Verified by Boli' : 'Entered by the creator')];
  if(done > 0){
    tiles.push(kTile(num(done), done===1 ? 'Deal completed on Boli' : 'Deals completed on Boli'));
    tiles.push(kTile(num(brands), brands===1 ? 'Brand worked with' : 'Brands worked with'));
    if(first!=null) tiles.push(kTile(Math.min(100, Math.round(first/done*100)) + '%', 'Approved first time', 'Videos accepted without changes'));
  } else tiles.push(kTile('New on Boli', 'No deals completed here yet', '', 'new'));
  if(rate) tiles.push(kTile(rs(rate), 'Usual rate for a video'));
  if(since) tiles.push(kTile(esc(since), 'Member since'));
  const bcats = kArr(st.brand_cats).map(c=>CATS[c]).filter(Boolean);
  const samples = kSamples(k), withViews = samples.filter(s=>s.views!=null), maxV = Math.max(1, ...withViews.map(s=>s.views));
  const sampleCard = s => { const yt = kYtId(s.url), plat = kPlatform(s.url);
    return `<div class="k-sample">${yt ? `<img class="k-thumb" data-kfb="${esc(plat)}" src="https://img.youtube.com/vi/${esc(yt)}/hqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="k-fb" aria-hidden="true">${esc(plat)}</div>`}
      <div class="k-sbody"><b>${esc(s.title)}</b><span class="meta">${esc(plat)}</span>
      ${s.views!=null || s.likes!=null ? `<div class="k-nums">${s.views!=null?`<span><strong>${num(s.views)}</strong> views</span>`:''}${s.likes!=null?`<span><strong>${num(s.likes)}</strong> likes</span>`:''}</div>`:''}
      <a class="pill" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Watch</a></div></div>`; };
  return `<article class="k-rep t-${hue(cats[0])}">
    <div class="k-band">
      <div class="k-id"><span class="k-av" aria-hidden="true">${esc(ini(k.name))}</span><div style="min-width:0"><h1>${esc(k.name)}</h1>${place?`<div class="k-sub">${esc(place)}</div>`:''}</div></div>
      <div class="k-chips">${k.verified?'<span class="k-chip solid">Verified</span>':''}${local?`<span class="k-chip solid">Local page: ${esc(local)}</span>`:''}${cats.map(c=>`<span class="k-chip">${esc(CATS[c]||c)}</span>`).join('')}${langs.map(l=>`<span class="k-chip">${esc(l)}</span>`).join('')}</div>
      ${bio?`<p class="k-bio">${esc(bio)}</p>`:''}
    </div>
    <div class="k-tiles">${tiles.join('')}</div>
    ${bcats.length?`<p class="meta">Has worked with brands in: ${esc(bcats.join(', '))}.</p>`:''}
    <section class="k-sec"><h2>Work samples</h2>
      ${samples.length ? `<div class="k-samples">${samples.map(sampleCard).join('')}</div>` : '<p class="meta">No samples added yet.</p>'}
      ${withViews.length>=2 ? `<div class="k-chart"><b>Views on these samples</b>${withViews.map(s=>`<div class="k-barrow"><div class="k-lab"><span>${esc(s.title)}</span><span>${num(s.views)}</span></div><div class="k-track"><div class="k-fill" style="width:${Math.max(2, Math.round(s.views/maxV*100))}%"></div></div></div>`).join('')}<span class="meta">Views and likes are entered by the creator.</span></div>`
        : (samples.some(s=>s.views!=null || s.likes!=null) ? '<p class="meta">Views and likes are entered by the creator.</p>' : '')}
    </section>
    ${deals.length?`<section class="k-sec"><h2>Open to</h2><div class="k-open">${deals.map(d=>`<span class="pill">${esc(TYPES[d]||d)}</span>`).join('')}</div></section>`:''}
    <p class="meta k-foot">Profile on Boli · boli.ourdreamwork.com</p>
  </article>`;
}

async function kShare(k){
  const link = kLink(k);
  if(navigator.share){ try{ await navigator.share({title:kStr(k.name) + ' on Boli', text:kStr(k.name) + ' is a creator on Boli.', url:link}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(link); toast('Link copied'); }
  catch(e){ const t = document.createElement('textarea'); t.value = link; t.setAttribute('readonly',''); t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); let done = false; try{ done = document.execCommand('copy'); }catch(_){} t.remove(); toast(done ? 'Link copied' : link); }
}

async function openKit(key){
  const st = S.kit = {key, k:null, loading:true, missing:false};
  S.view = 'c'; S.arg = key; render(); window.scrollTo(0,0);
  try{ st.k = kObj(await sb.rpc('public_profile', {p_key:String(key==null?'':key)})); }catch(e){ st.k = null; }
  st.loading = false; st.missing = !st.k;
  if(S.kit!==st || S.view!=='c') return;
  render();
}
function vKit(){
  const st = S.kit || {}, k = st.k, v = kViewer(k);
  const adminBack = S.me && S.me.is_admin && !isBrand() ? '<button class="link" data-act="nav" data-v="admin">‹ Back to Boli team</button>' : '';
  if(st.loading && !k) return `<div class="sec k-wrap">${adminBack}<p class="meta">Loading profile…</p></div>`;
  if(!k) return `<div class="sec k-wrap">${adminBack}<div class="panel"><h3>This profile is not available</h3><p class="meta">The creator may have turned it off.</p><div><button class="btn" data-act="home">See briefs on Boli</button></div></div></div>`;
  const share = '<button class="btn ghost" data-act="k-share">Share</button>';
  const cta = v==='visitor' ? `<button class="btn accent" data-act="k-work">Work with ${esc(kFirst(k.name))} on Boli</button>${share}<span class="meta">Boli connects brands with regional creators. Posting a brief is free.</span>`
    : v==='brand' ? `<button class="btn accent" data-act="k-invite">Invite to a brief</button>${share}`
    : v==='self' ? `${share}<button class="btn ghost" data-act="nav" data-v="profile">Edit profile</button><button class="btn ghost" data-act="nav" data-v="account">Manage link</button><span class="meta">${k.public_on===false ? 'Your public profile is off, so only you and brands on Boli can see this.' : 'This is what people see when you share your link.'}</span>`
    : share;
  return `<div class="sec k-wrap">${adminBack}<div class="k-bar">${cta}</div>${v!=='self' && S.cap && S.cap.studio && typeof kitEnquiryHTML==='function' ? kitEnquiryHTML(k) : ''}${kitHTML(k, {viewer:v})}</div>`;
}

/* In-app creator page for brands and the Boli team: the same report, then the invite section. */
function kInviteHTML(c){
  if(!c || !isBrand() || !fInvOn()) return '';
  const open = fOpenBriefs();
  return `<div class="panel" id="fInv"><h3>Invite to a brief</h3>${open.length ? open.map(b=>{
      const s = fBriefState(b, c.id);
      const right = s==='invite' ? `<button class="pill" data-act="f-invite" data-v="${esc(b.id)}" data-c="${esc(c.id)}" aria-pressed="true">Invite</button>`
        : `<span class="tag${s==='full'?'':' ok'}">${{invited:'Invited', applied:'Already applied', full:'Brief is full'}[s]}</span>`;
      return `<div class="f-inv"><span><b>${esc(b.title)}</b><br><span class="meta">${esc(payLabel(b))} · ${esc(TYPES[b.type]||'')}</span></span>${right}</div>`;
    }).join('') + '<p class="meta">The creator gets an email and sees the invitation on Boli. They still choose whether to apply.</p>'
    : `<p class="meta">Post a brief first, then invite creators to it.</p><div><button class="btn accent" data-act="nav" data-v="dash">Go to dashboard</button></div>`}</div>`;
}
function vCreator(){
  const st = S.cr || {}, k = st.k, admin = !isBrand() && S.me && S.me.is_admin;
  const back = `<button class="link k-noprint" data-act="nav" data-v="${admin?'admin':'find'}">‹ ${admin?'Back to Boli team':'All creators'}</button>`;
  if(st.loading && !k) return `<div class="sec k-wrap">${back}<p class="meta">Loading profile…</p></div>`;
  if(!k) return `<div class="sec k-wrap">${back}<p class="meta">This creator’s profile is not available.</p></div>`;
  return `<div class="sec k-wrap f-prof">${back}${kitHTML(k, {viewer:admin?'admin':'brand'})}
    <div class="k-bar">${k.public_on ? '<button class="btn ghost" data-act="k-share">Share this profile</button>' : ''}<span class="meta">Their page link is shared with you once you accept their application.</span></div>
    ${kInviteHTML(k)}${isBrand() && S.workOpen===false ? '<p class="meta" id="invSoon">You can invite creators once Boli opens for work.</p>' : ''}</div>`;
}
async function openCreator(id){
  const admin = !!(S.me && S.me.is_admin);
  if(!S.me || !(isBrand() || admin)) return go('home');
  const prev = S.cr, c0 = (S.creators||[]).find(x=>x.id===id) || null;
  const st = S.cr = {id, c:c0, k:c0 ? kFromProfile(c0, null) : null, loading:true, toInvite: !!(prev && prev.toInvite && prev.id===id)};
  S.view = 'creator'; S.arg = id; render(); window.scrollTo(0,0);
  try{
    let k = null;
    try{ k = kObj(await sb.rpc('public_profile', {p_key:String(id)})); }catch(e){ k = null; }
    if(!k){
      let c = st.c;
      if(!c){
        const cols = typeof PSEL!=='undefined' ? PSEL : PCOLS;
        const p = await q(sb.from('profiles').select(cols).eq('id', id).maybeSingle());
        c = p && p.role==='creator' ? p : null;
      }
      if(c){
        let sample = null;
        try{ const r = await sb.rpc('creator_card', {uid:id}); sample = !r.error && r.data && r.data[0] ? r.data[0].sample_link : null; }catch(e){}
        k = kFromProfile(c, sample);
      }
    }
    st.k = k;
  }catch(e){ toast(e.message || 'Something went wrong. Please try again.'); }
  st.loading = false;
  if(S.cr!==st || S.view!=='creator') return;
  render();
  if(st.toInvite){ st.toInvite = false; const el = $('fInv'); if(el) el.scrollIntoView({block:'start'}); }
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act^="k-"]'); if(!el || el.disabled) return;
  const a = el.dataset.act, k = S.view==='creator' ? (S.cr||{}).k : (S.kit||{}).k; if(!k) return;
  if(a==='k-share') return run(()=>kShare(k));
  if(a==='k-invite') return go('creator', k.id);
  if(a==='k-work'){ S.pendC = k.id; S.authRole = 'brand'; S.authMode = 'up'; return go('auth'); }
});
/* A thumbnail that fails to load is swapped for a plain labelled block. */
document.addEventListener('error', e=>{
  const img = e.target; if(!img || img.tagName!=='IMG' || !img.dataset || img.dataset.kfb==null) return;
  const d = document.createElement('div'); d.className = 'k-fb'; d.setAttribute('aria-hidden','true'); d.textContent = img.dataset.kfb || 'Video';
  img.replaceWith(d);
}, true);
</script>

<script>
/* ---------- Boli Studio: the creator's own business tools ---------- */
const ST_TABS = [['board','Collaborations'],['invoices','Invoices'],['earnings','Earnings'],['enquiries','Enquiries']];
const ST_STATUS = [['lead','Lead'],['agreed','Agreed'],['shooting','Shooting'],['sent','Sent'],['posted','Posted'],['paid','Paid'],['cancelled','Cancelled']];
const ST_FLOW = ['lead','agreed','shooting','sent','posted','paid'];
const ST_KIND = {reel:'Reel', story:'Story', post:'Post', ugc:'UGC video', integration:'Integration', youtube:'YouTube video', other:'Other'};
const ST_PLAT = {instagram:'Instagram', youtube:'YouTube', other:'Other'};
const ST_GST = [['none','No GST'],['cgst_sgst','CGST 9% + SGST 9%'],['igst','IGST 18%']];
const ST_MONTHS = ['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
const ST_APPMAP = {applied:'lead', accepted:'shooting', sent:'sent', approved:'posted', paid:'paid'};
const ST_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function stS(){ if(!S.st) S.st = {tab:'board', collabs:[], invoices:[], enquiries:[], agreements:[], billing:null, loaded:false, filter:'all', showCancelled:false, mode:null, edit:{}, confirm:null, fy:null, err:null}; return S.st; }
const stLabel = s => (ST_STATUS.find(x=>x[0]===s)||['',s])[1];
const stIST = ts => ts ? new Date(new Date(ts).getTime() + 19800000).toISOString().slice(0,10) : '';
const stDate = d => d ? new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '';
const stAdd = (d, n) => { const t = new Date(String(d).slice(0,10)+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
const stFY = d => { if(!d) return ''; const y = +String(d).slice(0,4), m = +String(d).slice(5,7), s = m>=4 ? y : y-1; return s + '-' + String(s+1).slice(2); };
const stFYStart = fy => +String(fy).slice(0,4);
const stTxt = v => { const t = String(v==null?'':v).trim(); return t ? t : null; };
const stInt = v => { const n = parseInt(String(v==null?'':v).replace(/[^0-9]/g,''), 10); return isNaN(n) ? 0 : n; };
const stNum = v => { const n = parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,'')); return isNaN(n) ? 0 : n; };
const stOverdueCollab = c => !!c.due_date && c.due_date < todayIN() && !['posted','paid','cancelled'].includes(c.status);
const stOverdueInv = i => i.status==='sent' && !!i.due_date && i.due_date < todayIN();
const stInvLink = i => location.origin + '/#/i/' + i.token;
const stAgrLink = a => location.origin + '/#/a/' + a.token;
const stInvFor = id => S.st.invoices.filter(i=>i.collab_id===id && i.status!=='void')[0];
const stAgrFor = id => S.st.agreements.filter(a=>a.collab_id===id && a.status!=='void')[0];
const stBillOk = () => { const b = S.st.billing; return !!(b && b.legal_name && (b.upi || b.account_no)); };
function stCalc(items, gst){
  const sub = Math.round((items||[]).reduce((t, it)=>t + stNum(it.qty) * stNum(it.rate), 0));
  const g = gst && gst!=='none' ? Math.round(sub * 0.18) : 0;
  return {sub, gst:g, total:sub + g};
}
function stCopy(link){ if(typeof copyLink==='function') return copyLink(link); try{ navigator.clipboard.writeText(link).then(()=>toast('Link copied'), ()=>toast(link)); }catch(e){ toast(link); } }
function stBoliDeals(){
  return (S.apps||[]).filter(a=>a.briefs && ST_APPMAP[a.status]).map(a=>{ const b = a.briefs, prod = b.comp==='product' || b.comp==='both';
    return {boli:true, id:a.id, brief_id:a.brief_id, brand_name:b.brand_name, title:b.title, kind:'boli', status:ST_APPMAP[a.status], fee:b.comp==='product'?0:(b.pay||0), product_note:prod?b.product_note:null, product_value:prod?(b.product_value||0):0, app:a}; });
}

/* ---------- data ---------- */
async function stLoad(){
  const st = stS(), uid = S.user.id;
  const t = p => Promise.resolve(p).then(r=>r && !r.error ? r.data : null, ()=>null);
  const [c, i, e, a, b] = await Promise.all([
    t(sb.from('collabs').select('*').eq('creator_id', uid).order('created_at', {ascending:false})),
    t(sb.from('invoices').select('*').eq('creator_id', uid).order('created_at', {ascending:false})),
    t(sb.from('enquiries').select('*').eq('creator_id', uid).order('created_at', {ascending:false})),
    t(sb.from('agreements').select('*').eq('creator_id', uid).order('created_at', {ascending:false})),
    t(sb.from('billing').select('*').eq('creator_id', uid).maybeSingle())]);
  st.collabs = c || []; st.invoices = i || []; st.enquiries = e || []; st.agreements = a || []; st.billing = b || null; st.loaded = true; st.loadedAt = Date.now();
}
async function openStudio(tab){
  if(!S.user || !S.me || S.me.role!=='creator'){ S.view='home'; S.arg=null; render(); return; }
  const st = stS();
  const t = ST_TABS.some(x=>x[0]===tab) ? tab : 'board', fromOutside = S.view!=='studio';
  if(st.tab!==t){ st.confirm = null; if(!(st.mode==='inv' && t==='invoices') && !((st.mode==='collab' || st.mode==='agr') && t==='board')) st.mode = null; }
  st.tab = t; S.view = 'studio'; S.arg = t;
  if(!st.loaded){ render(); try{ await stLoad(); }catch(e){ st.err = 'Could not load your Studio. Refresh to try again.'; } }
  if(S.view!=='studio') return;
  render(); window.scrollTo(0,0);
  if(st.loaded && (fromOutside || Date.now()-(st.loadedAt||0) > 20000)){
    stLoad().then(()=>{ if(S.view==='studio' && !st.mode){ const y=window.scrollY; render(); window.scrollTo(0,y); } }).catch(()=>{});
  }
}
async function stReload(msg){ await stLoad(); const y = window.scrollY; render(); window.scrollTo(0,y); if(msg) toast(msg); }

/* ---------- view ---------- */
function stSummary(){
  const st = S.st, active = st.collabs.filter(c=>['agreed','shooting','sent','posted'].includes(c.status)).length;
  const unpaid = st.invoices.filter(i=>i.status==='sent'), od = unpaid.filter(stOverdueInv);
  const sum = l => l.reduce((t,i)=>t + (i.total||0), 0), nw = st.enquiries.filter(e=>e.status==='new').length;
  const tile = (v, l, w) => `<div class="st-tile${w?' warn':''}"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="st-sum">${tile(num(active),'Active collaborations')}${tile(num(unpaid.length),'Unpaid invoices')}${tile(rs(sum(unpaid)),'Waiting to be paid')}${tile(rs(sum(od)),'Overdue', sum(od)>0)}${tile(num(nw),'New enquiries', nw>0)}</div>`;
}
function vStudio(){
  const st = stS();
  if(!S.me || S.me.role!=='creator') return `<p class="meta">Studio is for creators.</p>`;
  const nw = st.enquiries.filter(e=>e.status==='new').length;
  const tabs = `<nav class="st-tabs" aria-label="Studio sections">${ST_TABS.map(([k,t])=>`<button class="pill" data-act="st-tab" data-v="${k}" aria-pressed="${st.tab===k}">${t}${k==='enquiries'&&nw?`<span class="st-badge">${nw}</span>`:''}</button>`).join('')}</nav>`;
  let body;
  if(!st.loaded) body = st.err ? `<p class="meta">${esc(st.err)}</p>` : `<p class="meta">Loading your Studio…</p>`;
  else if(st.mode==='collab') body = stCollabEditor();
  else if(st.mode==='inv') body = stInvEditor();
  else if(st.mode==='agr') body = stAgrEditor();
  else body = st.tab==='invoices' ? stInvoices() : st.tab==='earnings' ? stEarnings() : st.tab==='enquiries' ? stEnquiries() : stBoard();
  return `<div class="st-wrap"><div class="st-head"><span class="eyebrow">Studio</span><h1>Your creator business</h1><p class="meta">Every collaboration, invoice and payment in one place, including deals that did not come through Boli.</p></div>

function stInvCheck(e){
  if(!stTxt(e.buyer.name)) return 'Add the brand or company name.';
  if(e.buyer.email && !ST_EMAIL.test(String(e.buyer.email).trim())) return 'Check the brand email.';
  if(!e.items.length || e.items.length>20) return 'Add between 1 and 20 items.';
  for(const it of e.items){ if(!stTxt(it.desc)) return 'Describe every item.'; if(!(stNum(it.qty)>0)) return 'Quantity must be more than 0.'; if(stNum(it.rate)<0) return 'Rate cannot be negative.'; }
  if(e.due_date && e.issue_date && e.due_date < e.issue_date) return 'The due date is before the issue date.';

    items:e.items.map(it=>({desc:String(it.desc).trim(), qty:stNum(it.qty), rate:stNum(it.rate)})), gst_type:e.gst_type||'none', issue_date:e.issue_date||null, due_date:e.due_date||null, notes:stTxt(e.notes), auto_remind:!!e.auto_remind};

async function stInvSave(){
  const e = S.st.edit.inv, err = stInvCheck(e);

    : await q(sb.from('invoices').insert({creator_id:S.user.id, ...p}).select().single());
  e.id = row.id; e.token = row.token; e.number = row.number || e.number;

async function stInvSend(id){
  const st = S.st;
  if(!stBillOk()) return toast('Add your billing details before sending.');
  let inv = id ? st.invoices.find(i=>i.id===id) : null;
  if(st.mode==='inv'){ const row = await stInvSave(); if(!row) return; inv = row; }
  if(!inv) return;
  await q(sb.from('invoices').update({status:'sent'}).eq('id', inv.id));
  const email = inv.buyer && inv.buyer.email;
  let msg = 'Marked as sent. Copy the link to share it with the brand.';
  if(email){ const r = await q(sb.rpc('send_invoice_email', {p_invoice:inv.id, p_kind:'send'})); msg = r==='sent' ? 'Invoice sent to ' + email : 'Marked as sent. ' + r; }
  st.mode = null; st.edit.inv = null; st.tab = 'invoices';
  await stReload(msg);

/* ---------- 3. earnings ---------- */
function stRecords(){
  const st = S.st, rows = [], invBy = {};
  st.invoices.forEach(i=>{ if(i.collab_id && i.status==='paid') invBy[i.collab_id] = i.number; });
  st.collabs.forEach(c=>{
    if(c.status==='paid') rows.push({date:stIST(c.paid_at) || c.post_date || stIST(c.updated_at), brand:c.brand_name, title:c.title, source:'Collaboration', kind:ST_KIND[c.kind]||'Other', amount:c.fee||0, product:c.product_value||0, invoice:invBy[c.id]||'', paid:true});
    else if(c.status==='posted' && c.product_value) rows.push({date:c.post_date || stIST(c.updated_at), brand:c.brand_name, title:c.title, source:'Collaboration', kind:ST_KIND[c.kind]||'Other', amount:0, product:c.product_value, invoice:'', paid:false});
  });
  st.invoices.forEach(i=>{ if(!i.collab_id && i.status==='paid') rows.push({date:stIST(i.paid_at) || i.issue_date, brand:(i.buyer||{}).name||'', title:((i.items||[])[0]||{}).desc||'', source:'Invoice', kind:'Invoice', amount:i.total||0, product:0, invoice:i.number||'', paid:true}); });
  (S.apps||[]).forEach(a=>{ const b = a.briefs; if(!b || a.status!=='paid') return; const prod = b.comp==='product' || b.comp==='both';
    rows.push({date:stIST(a.updated_at || a.created_at), brand:b.brand_name, title:b.title, source:'Boli', kind:'Boli deal', amount:b.comp==='product'?0:(b.pay||0), product:prod?(b.product_value||0):0, invoice:'', paid:true}); });
  return rows.filter(r=>r.date);
}
function stPending(){
  const st = S.st, inv = st.invoices.filter(i=>i.status==='sent');
  const withInv = new Set(inv.map(i=>i.collab_id).filter(Boolean));
  return inv.reduce((t,i)=>t+(i.total||0), 0) + st.collabs.filter(c=>['agreed','shooting','sent','posted'].includes(c.status) && !withInv.has(c.id)).reduce((t,c)=>t+(c.fee||0), 0);
}
function stEarnings(){
  const st = S.st, all = stRecords(), cur = stFY(todayIN());
  const fys = [...new Set([cur, ...all.map(r=>stFY(r.date))])].sort().reverse();
  const fy = fys.includes(st.fy) ? st.fy : cur;
  const rows = all.filter(r=>stFY(r.date)===fy).sort((a,b)=>a.date<b.date?-1:1);
  const earned = rows.reduce((t,r)=>t+r.amount, 0), prod = rows.reduce((t,r)=>t+r.product, 0);
  const paid = rows.filter(r=>r.paid && r.amount>0).length;
  const months = ST_MONTHS.map(()=>0); rows.forEach(r=>{ const m = +r.date.slice(5,7); months[(m+8)%12] += r.amount; });
  const max = Math.max(1, ...months);
  const brands = {}, kinds = {}; rows.forEach(r=>{ if(!r.amount) return; brands[r.brand] = (brands[r.brand]||0) + r.amount; kinds[r.kind] = (kinds[r.kind]||0) + r.amount; });
  const tbl = (o, h) => { const e = Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,8); return e.length ? `<table class="st-table"><thead><tr><th>${h}</th><th>Earned</th></tr></thead><tbody>${e.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${rs(v)}</td></tr>`).join('')}</tbody></table>` : '<p class="meta">Nothing earned yet in this year.</p>'; };
  const tile = (v, l) => `<div class="st-tile"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="st-row"><h2>Earnings</h2><button class="pill" data-act="st-csv" data-v="${esc(fy)}">Download CSV</button></div>
    <div class="st-filters" role="group" aria-label="Financial year">${fys.map(f=>`<button class="pill" data-act="st-fy" data-v="${esc(f)}" aria-pressed="${f===fy}">FY ${esc(f)}</button>`).join('')}</div>
    <div class="st-sum">${tile(rs(earned),'Earned in FY '+esc(fy))}${tile(rs(stPending()),'Pending now')}${tile(rs(prod),'Products received')}${tile(num(paid),'Paid deals')}${tile(rs(paid?Math.round(earned/paid):0),'Average per deal')}</div>
    <div class="panel"><b>Month by month</b><div class="st-bars" role="img" aria-label="Earnings by month">${months.map((v,n)=>`<div class="st-bar"><em>${v?rs(v):''}</em><i class="${v?'':'zero'}" style="height:${v?Math.max(3, Math.round(v/max*120)):2}px"></i><span>${ST_MONTHS[n]}</span></div>`).join('')}</div></div>
    <div class="split"><div class="panel"><b>Top brands</b>${tbl(brands,'Brand')}</div><div class="panel"><b>By type</b>${tbl(kinds,'Type')}</div></div>
    <p class="meta">For your records. Check tax questions with your CA.</p>`;
}
function stCSV(fy){
  const rows = stRecords().filter(r=>stFY(r.date)===fy).sort((a,b)=>a.date<b.date?-1:1);
  const c = x => { const s = String(x==null?'':x); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const lines = [['date','brand','title','source','amount','product value','invoice number'].join(',')].concat(rows.map(r=>[r.date, r.brand, r.title, r.source, r.amount, r.product, r.invoice].map(c).join(',')));
  return lines.join('\n') + '\n';
}

/* ---------- 4. enquiries ---------- */
function stEnquiries(){
  const st = S.st, list = st.enquiries;
  if(!list.length) return `<h2>Enquiries</h2><div class="panel"><h3>No enquiries yet</h3><p class="meta">Brands can send you an enquiry from the "Work with me" button on your public profile. Put your Boli profile link in your Instagram bio so brands find it.</p>${S.me && S.me.public_on ? '' : '<div><button class="pill" data-act="nav" data-v="account">Switch on your public profile</button></div>'}</div>`;
  return `<h2>Enquiries</h2>` + list.map(e=>{
    const k = 'enq:' + e.id;
    const chip = e.status==='new' ? '<span class="tag">New</span>' : e.status==='converted' ? '<span class="tag ok">Added to collaborations</span>' : '<span class="tag st-mute">Declined</span>';
    return `<article class="st-card"><div class="st-top"><b>${esc(e.brand_name)}</b>${chip}</div>
      <p class="meta">${esc(e.contact_name||'')}${e.contact_name?' · ':''}<a class="link" href="mailto:${esc(e.email)}">${esc(e.email)}</a>${e.phone?` · <a class="link" href="tel:${esc(String(e.phone).replace(/[^0-9+]/g,''))}">${esc(e.phone)}</a>`:''}</p>
      ${e.budget?`<p><b>Budget ${rs(e.budget)}</b></p>`:''}<div class="st-msg">${esc(e.message)}</div><p class="meta">${stDate(stIST(e.created_at))}</p>
      <div class="st-acts">${e.status==='new'?`<button class="pill" data-act="st-econv" data-v="${esc(e.id)}" aria-pressed="true">Add to collaborations</button><button class="pill" data-act="st-edecl" data-v="${esc(e.id)}">Decline</button>`:''}${st.confirm===k?'':`<button class="pill" data-act="st-ask" data-v="${esc(k)}">Delete</button>`}</div>
      ${stConfirmHTML(k, 'Delete this enquiry?', 'Yes, delete')}</article>`;
  }).join('');
}

/* ---------- 5. agreements ---------- */
const ST_USAGE = [[0,'Repost or share only'],[3,'3 months'],[6,'6 months'],[12,'12 months'],[24,'24 months']];
const ST_EXCL = [[0,'None'],[7,'7 days'],[15,'15 days'],[30,'30 days'],[60,'60 days'],[90,'90 days']];
const ST_REV = [[0,'None'],[1,'1 round'],[2,'2 rounds'],[3,'3 rounds']];
const ST_PAYD = [[7,'7 days'],[15,'15 days'],[30,'30 days'],[45,'45 days']];
function stAgrBlank(c){ c = c || {}; return {id:null, collab_id:c.id||null, status:'draft', terms:{brand_name:c.brand_name||'', title:c.title||'', deliverables:c.deliverables||'', post_date:c.post_date||'', fee:c.fee||0, product_note:c.product_note||'', product_value:c.product_value||0, usage_months:3, exclusivity_days:0, revisions:1, payment_days:15, extra:''}}; }
function stAgrPreview(t){
  if(typeof agreementText==='function'){ try{ return agreementText(t, {creator:S.me.name, brand:t.brand_name}); }catch(e){} }
  const li = x => `<li>${x}</li>`;
  return `<ol>${[li(`Parties: ${esc(S.me.name)} (creator) and ${esc(t.brand_name)} (brand).`), li(`Work: ${esc(t.title)}${t.deliverables?' — '+esc(t.deliverables):''}${t.post_date?', posting on '+stDate(t.post_date):''}.`),
    li(`Fee: ${rs(t.fee)}${t.product_note?' plus '+esc(t.product_note):''}, paid within ${num(t.payment_days)} days of posting.`), li(`Usage rights: ${t.usage_months?num(t.usage_months)+' months':'repost or share only'}. Exclusivity: ${t.exclusivity_days?num(t.exclusivity_days)+' days':'none'}. Revisions: ${num(t.revisions)}.`),
    t.extra?li(esc(t.extra)):''].join('')}</ol>`;
}
function stAgrEditor(){
  const e = S.st.edit.agr || stAgrBlank(), t = e.terms, v = x => esc(x==null?'':x), ro = e.status!=='draft';
  const sel = (k, opts) => `<select data-sf="agr.terms.${k}" data-t="int" data-prev="1"${ro?' disabled':''}>${opts.map(([a,b])=>`<option value="${a}"${+t[k]===a?' selected':''}>${b}</option>`).join('')}</select>`;
  const dis = ro ? ' disabled' : '';
  const status = e.status==='accepted' ? `<div class="lock"><b>Accepted${e.brand_signed_name?' by '+esc(e.brand_signed_name):''}${e.brand_signed_at?' on '+stDate(stIST(e.brand_signed_at)):''}</b>${e.brand_signed_email?`<span class="meta">${esc(e.brand_signed_email)}</span>`:''}</div>`
    : e.status==='sent' ? `<div class="lock"><b>Signed by you and sent. Waiting for the brand to accept.</b><span class="st-link">${esc(location.origin + '/#/a/' + (e.token||''))}</span><div><button type="button" class="pill" data-act="st-acopy">Copy link</button></div></div>` : '';
  const k = 'avoid:' + (e.id||'');
  return `<form id="stAgrForm" class="panel st-form" novalidate>
    <button type="button" class="link" data-act="st-back">‹ Back to collaborations</button>
    <h2>Collaboration agreement</h2>${status}
    <div class="two"><label>Brand<input data-sf="agr.terms.brand_name" data-prev="1" maxlength="100" value="${v(t.brand_name)}"${dis}></label><label>Work<input data-sf="agr.terms.title" data-prev="1" maxlength="150" value="${v(t.title)}"${dis}></label></div>
    <label>Deliverables<textarea data-sf="agr.terms.deliverables" data-prev="1" rows="3" maxlength="1000"${dis}>${v(t.deliverables)}</textarea></label>
    <div class="two"><label>Posting date<input type="date" data-sf="agr.terms.post_date" data-prev="1" value="${v(t.post_date)}"${dis}></label><label>Fee in ₹<input type="number" min="0" step="100" data-sf="agr.terms.fee" data-t="int" data-prev="1" value="${v(t.fee)}"${dis}></label></div>
    <div class="two"><label>Product (optional)<input data-sf="agr.terms.product_note" data-prev="1" maxlength="150" value="${v(t.product_note)}"${dis}></label><label>Product value in ₹<input type="number" min="0" data-sf="agr.terms.product_value" data-t="int" data-prev="1" value="${v(t.product_value)}"${dis}></label></div>
    <div class="two"><label>Usage rights${sel('usage_months', ST_USAGE)}</label><label>Exclusivity${sel('exclusivity_days', ST_EXCL)}</label></div>
    <div class="two"><label>Revisions${sel('revisions', ST_REV)}</label><label>Payment within${sel('payment_days', ST_PAYD)}</label></div>
    <label>Extra terms (optional)<textarea data-sf="agr.terms.extra" data-prev="1" rows="2" maxlength="1000"${dis}>${v(t.extra)}</textarea></label>
    <b>Preview</b><div class="st-prev" id="stAgrPrev">${stAgrPreview(t)}</div>
    <p class="meta" id="staErr" hidden></p>
    <div class="st-acts">${ro?'':`<button class="btn" type="submit">Save draft</button><button type="button" class="btn accent" data-act="st-asend">Sign and send</button>`}
      ${e.id && e.status!=='void' && e.status!=='accepted' && S.st.confirm!==k ? `<button type="button" class="btn ghost" data-act="st-ask" data-v="${esc(k)}">Void</button>` : ''}
      <button type="button" class="btn ghost" data-act="st-back">${ro?'Close':'Cancel'}</button></div>
    ${stConfirmHTML(k, 'Void this agreement?', 'Yes, void')}
  </form>`;
}
function stAgrTerms(t){
  return {brand_name:String(t.brand_name||'').trim(), title:String(t.title||'').trim(), deliverables:String(t.deliverables||'').trim(), post_date:t.post_date||null, fee:stInt(t.fee), product_note:String(t.product_note||'').trim(), product_value:stInt(t.product_value),
    usage_months:stInt(t.usage_months), exclusivity_days:stInt(t.exclusivity_days), revisions:stInt(t.revisions), payment_days:stInt(t.payment_days), extra:String(t.extra||'').trim()};
}
async function stAgrSave(){
  const e = S.st.edit.agr, t = stAgrTerms(e.terms);
  if(!t.brand_name || !t.title){ const p = $('staErr'); if(p){ p.textContent = 'Add the brand and the work.'; p.hidden = false; } return null; }
  const row = e.id ? await q(sb.from('agreements').update({terms:t}).eq('id', e.id).select().single())
    : await q(sb.from('agreements').insert({creator_id:S.user.id, collab_id:e.collab_id||null, terms:t}).select().single());
  e.id = row.id; e.token = row.token;
  return row;
}

/* ---------- state binding ---------- */
function stSet(path, val){
  const parts = path.split('.'); let o = S.st.edit;
  for(let i=0;i<parts.length-1;i++){ const k = parts[i]; if(o[k]==null) o[k] = /^\d+$/.test(parts[i+1]) ? [] : {}; o = o[k]; }
  o[parts[parts.length-1]] = val;
}
document.addEventListener('input', stBind); document.addEventListener('change', stBind);
function stBind(ev){
  const el = ev.target; if(!el || !el.dataset || !el.dataset.sf || S.view!=='studio') return;
  const t = el.dataset.t;
  let val = t==='bool' ? el.checked : el.value;
  if(t==='int' && el.tagName==='SELECT') val = stInt(val);
  if(el.dataset.sf==='inv.buyer.gstin'){ const up = el.value.toUpperCase(); if(up!==el.value){ const p = el.selectionStart; el.value = up; try{ el.setSelectionRange(p,p); }catch(e){} } val = up; }
  stSet(el.dataset.sf, val);
  if(el.dataset.tot){ const e = S.st.edit.inv; const tot = $('stInvTot'); if(tot && e) tot.innerHTML = stTotHTML(e);
    const m = el.dataset.sf.match(/^inv\.items\.(\d+)\./); if(m){ const it = e.items[+m[1]], a = document.querySelector(`[data-amt="${m[1]}"]`); if(a && a.firstChild) a.firstChild.nodeValue = rs(Math.round(stNum(it.qty)*stNum(it.rate))) + (e.items.length>1?' ':''); } }
  if(el.dataset.prev){ const p = $('stAgrPrev'); if(p && S.st.edit.agr) p.innerHTML = stAgrPreview(S.st.edit.agr.terms); }
}
function stRender(){ const y = window.scrollY; render(); window.scrollTo(0, y); }
function stOpenMode(mode, tab){ const st = S.st; st.mode = mode; st.confirm = null; if(S.arg!==tab){ st.tab = tab; go('studio', tab); } else { render(); } window.scrollTo(0,0); }

/* ---------- events ---------- */
document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-act^="st-"]'); if(!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v, st = stS();
  if(a==='st-tab'){ st.confirm = null; if(st.mode && !((st.mode==='inv' && v==='invoices') || ((st.mode==='collab'||st.mode==='agr') && v==='board'))) st.mode = null; return go('studio', v); }
  if(a==='st-filter'){ st.filter = v; return stRender(); }
  if(a==='st-canc'){ st.showCancelled = !st.showCancelled; return stRender(); }
  if(a==='st-fy'){ st.fy = v; return stRender(); }
  if(a==='st-ask'){ st.confirm = v; return stRender(); }
  if(a==='st-no'){ st.confirm = null; return stRender(); }
  if(a==='st-back'){ st.mode = null; st.confirm = null; return stRender(); }
  if(a==='st-cnew'){ st.edit.collab = {platform:'instagram', kind:'reel', status:'agreed', fee:'', product_value:''}; return stOpenMode('collab', 'board'); }
  if(a==='st-cedit'){ const c = st.collabs.find(x=>x.id===v); if(!c) return; st.edit.collab = {...c}; return stOpenMode('collab', 'board'); }
  if(a==='st-next') return run(async()=>{ await q(sb.from('collabs').update({status:el.dataset.s}).eq('id', v)); await stReload('Moved to ' + stLabel(el.dataset.s)); });
  if(a==='st-inew'){ const c = v ? st.collabs.find(x=>x.id===v) : null; const e = stInvBlank();
    if(c){ e.collab_id = c.id; e.buyer.name = c.brand_name || ''; e.buyer.email = c.brand_email || ''; e.items = [{desc:(ST_KIND[c.kind]||'Work') + ' — ' + c.title, qty:1, rate:c.fee||0}]; }
    st.edit.inv = e; return stOpenMode('inv', 'invoices'); }
  if(a==='st-iopen'){ const i = st.invoices.find(x=>x.id===v); if(!i) return; if(i.status!=='draft'){ st.mode = null; return go('i', i.token); } st.edit.inv = stInvFromRow(i); return stOpenMode('inv', 'invoices'); }
  if(a==='st-iadd'){ const e = st.edit.inv; if(e && e.items.length<20){ e.items.push({desc:'', qty:1, rate:''}); stRender(); } return; }
  if(a==='st-idel'){ const e = st.edit.inv; if(e && e.items.length>1){ e.items.splice(+v, 1); stRender(); } return; }
  if(a==='st-isend') return run(()=>stInvSend(v || null));
  if(a==='st-icopy'){ const i = st.invoices.find(x=>x.id===v); if(i) stCopy(stInvLink(i)); return; }
  if(a==='st-iview'){ const i = st.invoices.find(x=>x.id===v); if(i) go('i', i.token); return; }
  if(a==='st-irem') return run(async()=>{ const r = await q(sb.rpc('send_invoice_email', {p_invoice:v, p_kind:'reminder'})); await stReload(r==='sent' ? 'Reminder sent' : String(r||'Could not send the reminder.')); });
  if(a==='st-ipaid') return run(async()=>{ await q(sb.from('invoices').update({status:'paid'}).eq('id', v)); await stReload('Marked as paid'); });
  if(a==='st-iunpaid') return run(async()=>{ await q(sb.from('invoices').update({status:'sent'}).eq('id', v)); await stReload('Marked as not paid'); });
  if(a==='st-csv'){ const blob = new Blob([stCSV(v)], {type:'text/csv;charset=utf-8'}); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'boli-earnings-' + v + '.csv'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 1000); return; }
  if(a==='st-econv') return run(async()=>{ const e = st.enquiries.find(x=>x.id===v); if(!e) return;
    const row = await q(sb.from('collabs').insert({creator_id:S.user.id, source:'enquiry', enquiry_id:e.id, status:'lead', brand_name:e.brand_name, contact_name:e.contact_name||null, brand_email:e.email||null, brand_phone:e.phone||null, fee:e.budget||0, title:String(e.message||'Enquiry').slice(0,60)}).select().single());
    await q(sb.from('enquiries').update({status:'converted', collab_id:row.id}).eq('id', e.id));
    await stReload('Added to your collaborations as a lead'); });
  if(a==='st-edecl') return run(async()=>{ await q(sb.from('enquiries').update({status:'declined'}).eq('id', v)); await stReload('Enquiry declined'); });
  if(a==='st-anew'){ const c = st.collabs.find(x=>x.id===v); st.edit.agr = stAgrBlank(c); return stOpenMode('agr', 'board'); }
  if(a==='st-aopen'){ const g = st.agreements.find(x=>x.id===v); if(!g) return; st.edit.agr = {id:g.id, collab_id:g.collab_id, status:g.status, token:g.token, terms:Object.assign(stAgrBlank().terms, g.terms||{}), brand_signed_name:g.brand_signed_name, brand_signed_email:g.brand_signed_email, brand_signed_at:g.brand_signed_at}; return stOpenMode('agr', 'board'); }
  if(a==='st-acopy'){ const e = st.edit.agr; if(e && e.token) stCopy(location.origin + '/#/a/' + e.token); return; }
  if(a==='st-asend') return run(async()=>{ const row = await stAgrSave(); if(!row) return;
    await q(sb.from('agreements').update({status:'sent'}).eq('id', row.id));
    const c = st.collabs.find(x=>x.id===st.edit.agr.collab_id);
    let msg = 'Signed and sent. Copy the link to share it with the brand.';
    if(c && c.brand_email){ const r = await q(sb.rpc('send_agreement_email', {p_agreement:row.id})); msg = r==='sent' ? 'Agreement sent to ' + c.brand_email : 'Signed. ' + r; }
    await stLoad(); const g = st.agreements.find(x=>x.id===row.id);
    if(g) st.edit.agr = {id:g.id, collab_id:g.collab_id, status:g.status, token:g.token, terms:Object.assign(stAgrBlank().terms, g.terms||{})};
    stRender(); toast(msg); });
  if(a==='st-yes') return run(async()=>{ const [kind, id] = String(v).split(':'); st.confirm = null;
    if(kind==='collab'){ await q(sb.from('collabs').delete().eq('id', id)); return stReload('Collaboration deleted'); }
    if(kind==='void'){ await q(sb.from('invoices').update({status:'void'}).eq('id', id)); return stReload('Invoice voided'); }
    if(kind==='enq'){ await q(sb.from('enquiries').delete().eq('id', id)); return stReload('Enquiry deleted'); }
    if(kind==='avoid' && id){ await q(sb.from('agreements').update({status:'void'}).eq('id', id)); st.mode = null; return stReload('Agreement voided'); } });
});
document.addEventListener('submit', ev=>{
  const id = ev.target.id; if(id!=='stCollabForm' && id!=='stInvForm' && id!=='stAgrForm') return; ev.preventDefault();
  const st = stS();
  if(id==='stCollabForm') return run(async()=>{
    const e = st.edit.collab || {}, p = stCollabPayload(e), err = $('stcErr');
    const bad = !p.brand_name ? 'Add the brand name.' : !p.title ? 'Say what the deal is.' : (p.brand_email && !ST_EMAIL.test(p.brand_email)) ? 'Check the brand email.' : '';
    if(bad){ if(err){ err.textContent = bad; err.hidden = false; } return; }
    if(e.id) await q(sb.from('collabs').update(p).eq('id', e.id)); else await q(sb.from('collabs').insert({creator_id:S.user.id, ...p}));
    st.mode = null; st.edit.collab = null; await stReload(e.id ? 'Collaboration saved' : 'Collaboration added');
  });
  if(id==='stInvForm') return run(async()=>{ const row = await stInvSave(); if(!row) return; st.mode = null; st.edit.inv = null; await stReload('Draft saved'); });
  if(id==='stAgrForm') return run(async()=>{ const row = await stAgrSave(); if(!row) return; await stLoad(); stRender(); toast('Draft saved'); });
});
</script>

<style>
/* ---------- part_public: invoice, agreement, enquiry (pages brands see) ---------- */

.pb-paper *{border-color:#e4e4ea}
.pb-paper .pb-mut{color:#62626e}

.pb-meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:.86rem;text-align:left}
.pb-meta span:nth-child(odd){color:#62626e}

.pb-party h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:#62626e;margin-bottom:4px;font-family:var(--body);font-weight:700}

.pb-party p{white-space:pre-line;overflow-wrap:anywhere}
.pb-tblw{overflow-x:auto;margin-top:18px;-webkit-overflow-scrolling:touch}
.pb-tbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:420px}
.pb-tbl th{background:#f3f3f7;text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid #e4e4ea;font-size:.8rem}

<script>
/* ---------- part_public ---------- */
const PB_ONES = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const PB_TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function pbBelow100(n){ return n < 20 ? PB_ONES[n] : PB_TENS[Math.floor(n/10)] + (n%10 ? ' ' + PB_ONES[n%10] : ''); }
function pbBelow1000(n){ const h = Math.floor(n/100), r = n%100; return (h ? PB_ONES[h] + ' Hundred' : '') + (h && r ? ' ' : '') + (r ? pbBelow100(r) : ''); }
function pbWordsInt(n){
  n = Math.floor(Math.abs(Number(n)||0));
  if(n === 0) return 'Zero';
  const parts = [], crore = Math.floor(n/1e7), rest = n % 1e7;
  if(crore) parts.push(pbWordsInt(crore) + ' Crore');
  const lakh = Math.floor(rest/1e5), th = Math.floor((rest%1e5)/1000), r = rest%1000;
  if(lakh) parts.push(pbBelow100(lakh) + ' Lakh');
  if(th) parts.push(pbBelow100(th) + ' Thousand');
  if(r) parts.push(pbBelow1000(r));
  return parts.join(' ');
}
function pbRupeesWords(n){ return 'Rupees ' + pbWordsInt(n) + ' only'; }
function pbDate(d){ if(!d) return ''; const x = new Date(String(d).length===10 ? d+'T00:00:00' : d); return isNaN(x) ? '' : x.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function pbInt(v){ const n = Math.round(Number(v)); return isFinite(n) && n > 0 ? n : 0; }
function pbNum(v){ const n = Number(v); return isFinite(n) ? n : 0; }
function pbStr(v){ return v==null ? '' : String(v).trim(); }
function pbMoney(n){ return '₹' + pbNum(n).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function pbFirst(name){ return pbStr(name).split(/\s+/)[0] || 'this creator'; }
function pbEmailOk(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(pbStr(e)); }
function pbState(){ if(!S.pub) S.pub = {inv:null, agr:null, enq:{}}; if(!S.pub.enq) S.pub.enq = {}; return S.pub; }

/* ---------- agreement text ---------- */
function agreementText(t, n){
  t = t || {}; n = n || {};
  const creator = pbStr(n.creator) || 'the creator', brand = pbStr(n.brand) || pbStr(t.brand_name) || 'the brand';
  const fee = pbInt(t.fee), pv = pbInt(t.product_value), prod = pbStr(t.product_note);
  const usage = Math.min(24, pbInt(t.usage_months)), excl = Math.min(90, pbInt(t.exclusivity_days)), rev = Math.min(5, pbInt(t.revisions)), payd = Math.min(90, pbInt(t.payment_days));
  const post = t.post_date ? pbDate(t.post_date) : '';
  const prodLine = prod ? `${esc(prod)}${pv ? ' (worth '+esc(pbMoney(pv))+')' : ''}` : '';
  const c = [];
  c.push(['Who this is between', `This agreement is between <b style="display:inline">${esc(creator)}</b> (“Creator”) and <b style="display:inline">${esc(brand)}</b> (“Brand”).`]);
  c.push(['The work', `Creator will make: ${esc(pbStr(t.title) || 'the content described below')}.` + (pbStr(t.deliverables) ? `<br>Deliverables: ${esc(t.deliverables).replace(/\n/g,'<br>')}` : '') + `<br>Posting date: ${post ? esc(post) : 'a date both sides agree in writing'}.`]);
  if(fee && prodLine) c.push(['Fee and product', `Brand will pay Creator ${esc(pbMoney(fee))}, and will also send ${prodLine}, which Creator keeps.`]);
  else if(fee) c.push(['Fee', `Brand will pay Creator ${esc(pbMoney(fee))}.`]);
  else if(prodLine) c.push(['Product', `Brand will send ${prodLine}, which Creator keeps. No fee is payable for this collaboration.`]);
  else c.push(['Fee', 'No fee or product is agreed in this document. Any payment must be agreed in writing.']);
  if(fee) c.push(['Payment', payd ? `Brand will pay within ${payd} days of the content being posted, against Creator’s invoice.` : 'Brand will pay when the content is posted, against Creator’s invoice.']);
  c.push(['Review and changes', rev ? `Creator will share the content before posting. Brand may ask for up to ${rev} round${rev>1?'s':''} of reasonable changes that stay within this brief.` : 'Creator will share the content before posting. Brand may check it for factual errors; no further rounds of changes are included.']);
  c.push(['Disclosure', 'Creator will mark the post as a paid partnership or ad, as required by the ASCI guidelines for influencer advertising.']);
  c.push(['Usage rights', usage ? `Brand may use the content in its own organic posts and paid ads for ${usage} month${usage>1?'s':''} from posting. After that, Brand may only repost it with credit to Creator.` : 'Brand may share or repost Creator’s post with credit. Use in paid ads is not included.']);
  c.push(['Ownership', 'Creator keeps ownership of the content. Brand gets only the right to use it described above.']);
  c.push(['Exclusivity', excl ? `Creator will not post for a competing brand in the same category for ${excl} days from posting.` : 'There is no exclusivity. Creator may work with other brands.']);
  c.push(['Cancellation', 'If Brand cancels after Creator has started shooting, 50% of the fee is payable.' + (prodLine ? ' Any product already received stays with Creator.' : '')]);
  if(pbStr(t.extra)) c.push(['Other terms', esc(t.extra).replace(/\n/g,'<br>')]);
  return `<ol>${c.map(([h,b])=>`<li><b>${h}</b><p>${b}</p></li>`).join('')}</ol><p class="meta" style="margin-top:14px">This is a simple template agreement. For larger deals, have it reviewed by a lawyer.</p>`;
}

/* ---------- invoice ---------- */
async function openInvoice(token){
  const st = pbState();
  st.inv = {token: pbStr(token), d:null, loading:true};
  S.view = 'i'; S.arg = token; render(); window.scrollTo(0,0);
  let d = null;
  try{ const r = await sb.rpc('public_invoice', {p_token: pbStr(token)}); d = r && !r.error ? r.data : null; }catch(e){ d = null; }
  if(S.view !== 'i' || S.arg !== token) return;
  st.inv = {token: pbStr(token), d: d && typeof d === 'object' ? d : null, loading:false};
  render(); window.scrollTo(0,0);
}
function pbItems(d){
  const raw = Array.isArray(d.items) ? d.items : [];
  return raw.map(x=>({desc: pbStr(x && x.desc), qty: pbNum(x && x.qty), rate: pbNum(x && x.rate)})).filter(x=>x.desc || x.qty || x.rate);
}
function pbTotals(d){
  const items = pbItems(d);
  const sub = d.subtotal != null ? pbNum(d.subtotal) : Math.round(items.reduce((s,x)=>s + x.qty*x.rate, 0));
  const type = ['cgst_sgst','igst'].includes(d.gst_type) ? d.gst_type : 'none';
  const gst = type==='none' ? 0 : (d.gst_amount != null ? pbNum(d.gst_amount) : Math.round(sub*0.18));
  const total = d.total != null ? pbNum(d.total) : sub + gst;
  const cg = type==='cgst_sgst' ? Math.round(sub*0.09) : 0;
  return {items, sub, type, gst, total, cg, sg: type==='cgst_sgst' ? gst - cg : 0};
}
function pbUpiLink(upi, name, total, number){
  return 'upi://pay?pa=' + encodeURIComponent(upi) + '&pn=' + encodeURIComponent(name) + '&am=' + encodeURIComponent(pbNum(total).toFixed(2)) + '&cu=INR&tn=' + encodeURIComponent('Invoice ' + number);
}
function vInvoice(){
  const st = pbState(), I = st.inv;
  if(!I || I.loading) return `<div class="pb-wrap"><p class="meta">Loading invoice…</p></div>`;
  const d = I.d;
  if(!d) return `<div class="pb-wrap"><div class="panel"><h2>This invoice is not available</h2><p class="meta">It may have been cancelled, or the link is incomplete. Please check with the person who sent it.</p><div><button class="btn" data-act="home">Go to Boli</button></div></div></div>`;
  const s = d.seller && typeof d.seller === 'object' ? d.seller : {}, b = d.buyer && typeof d.buyer === 'object' ? d.buyer : {};
  const T = pbTotals(d), number = pbStr(d.number), paid = d.status === 'paid';
  const sname = pbStr(s.legal_name) || pbStr(s.name) || pbStr(s.profile_name) || pbStr(d.creator_name) || 'Creator';
  const gstin = pbStr(s.gstin), title = T.type !== 'none' && gstin ? 'Tax invoice' : 'Invoice';
  const overdue = !paid && d.due_date && new Date(d.due_date+'T23:59:59') < new Date();
  const line = (k,v) => v ? `<span>${k}</span><b>${esc(v)}</b>` : '';
  const upi = pbStr(s.upi), acct = pbStr(s.account_no);
  const pay = paid ? '' : `<div class="panel pb-pay pb-noprint" id="pbPay">
      <div class="row" style="flex-wrap:wrap"><h2>Pay ${esc(pbMoney(T.total))}</h2>${d.due_date?`<span class="${overdue?'tag':'tag ok'}">${overdue?'Overdue since':'Due by'} ${esc(pbDate(d.due_date))}</span>`:''}</div>
      ${d.pay_online ? `<div><button class="btn accent" data-act="pub-pay" data-v="${esc(I.token)}">Pay online</button></div><p class="meta">Card, netbanking and UPI, processed securely through Boli.</p>` : ''}
      ${upi || acct ? `<div class="pb-paygrid">
        ${upi ? `<div class="pb-form" style="gap:8px"><b>UPI</b><div><a class="btn" href="${esc(pbUpiLink(upi, sname, T.total, number))}">Pay with UPI app</a></div><div class="pb-qr" id="pbQr" data-upi="${esc(pbUpiLink(upi, sname, T.total, number))}" aria-label="UPI QR code"></div><p class="meta">UPI ID: <span class="pb-mono">${esc(upi)}</span>. Scan with any UPI app, or tap the button on your phone.</p></div>` : ''}
        ${acct ? `<div style="display:flex;flex-direction:column;gap:4px"><b>Bank transfer</b>
          ${pbStr(s.account_name)?`<span class="meta">Account name</span><span>${esc(s.account_name)}</span>`:''}
          <span class="meta">Account number</span><span class="pb-mono">${esc(acct)}</span>
          ${pbStr(s.ifsc)?`<span class="meta">IFSC</span><span class="pb-mono">${esc(s.ifsc)}</span>`:''}
          ${pbStr(s.bank_name)?`<span class="meta">Bank</span><span>${esc(s.bank_name)}</span>`:''}</div>` : ''}
      </div>` : (d.pay_online ? '' : `<p class="meta">Payment details were not added to this invoice. Please contact ${esc(pbFirst(sname))} for them.</p>`)}
      <p class="meta">Please mention invoice ${esc(number)} with your payment.${d.pay_online ? '' : ' Online card and netbanking payment through Boli is coming soon.'}</p>
    </div>`;
  return `<div class="pb-wrap">
    <div class="pb-bar pb-noprint"><span class="eyebrow">Invoice from ${esc(sname)}</span><div class="pb-acts"><button class="pill" data-act="pub-print">Print or save as PDF</button></div></div>
    <article class="pb-paper" aria-label="${esc(title)} ${esc(number)}">
      ${paid ? '<div class="pb-ribbon" aria-label="Paid">PAID</div>' : ''}
      <div class="pb-head">
        <div><h1>${title}</h1><p class="pb-mut" style="margin-top:4px">${esc(sname)}</p></div>
        <div class="pb-meta">${line('Invoice no.', number)}${line('Date', pbDate(d.issue_date))}${line('Due', pbDate(d.due_date))}${paid?'<span>Status</span><b style="color:#0f7a57">Paid</b>':''}</div>
      </div>
      <div class="pb-parties">
        <div class="pb-party"><h3>From</h3><b>${esc(sname)}</b>${pbStr(s.address)?`<p>${esc(s.address)}</p>`:''}${pbStr(s.state)?`<p class="pb-mut">State: ${esc(s.state)}</p>`:''}${pbStr(s.pan)?`<p class="pb-mut">PAN: <span class="pb-mono">${esc(s.pan)}</span></p>`:''}${gstin?`<p class="pb-mut">GSTIN: <span class="pb-mono">${esc(gstin)}</span></p>`:''}</div>
        <div class="pb-party"><h3>Bill to</h3><b>${esc(pbStr(b.name) || 'Brand')}</b>${pbStr(b.address)?`<p>${esc(b.address)}</p>`:''}${pbStr(b.state)?`<p class="pb-mut">State: ${esc(b.state)}</p>`:''}${pbStr(b.gstin)?`<p class="pb-mut">GSTIN: <span class="pb-mono">${esc(b.gstin)}</span></p>`:''}${pbStr(b.email)?`<p class="pb-mut">${esc(b.email)}</p>`:''}</div>
      </div>
      <div class="pb-tblw"><table class="pb-tbl">
        <thead><tr><th class="pb-ix" style="width:36px">#</th><th>Description</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead>
        <tbody>${T.items.map((x,i)=>`<tr><td class="pb-ix">${i+1}</td><td>${esc(x.desc)}</td><td class="n">${esc(x.qty.toLocaleString('en-IN'))}</td><td class="n">${esc(pbMoney(x.rate))}</td><td class="n">${esc(pbMoney(Math.round(x.qty*x.rate*100)/100))}</td></tr>`).join('') || '<tr><td colspan="5" class="pb-mut">No items</td></tr>'}</tbody>
      </table></div>
      <div class="pb-sum">
        <div><span class="pb-mut">Subtotal</span><span>${esc(pbMoney(T.sub))}</span></div>
        ${T.type==='cgst_sgst' ? `<div><span class="pb-mut">CGST 9%</span><span>${esc(pbMoney(T.cg))}</span></div><div><span class="pb-mut">SGST 9%</span><span>${esc(pbMoney(T.sg))}</span></div>` : ''}
        ${T.type==='igst' ? `<div><span class="pb-mut">IGST 18%</span><span>${esc(pbMoney(T.gst))}</span></div>` : ''}
        <div class="pb-tot"><span>Total</span><span>${esc(pbMoney(T.total))}</span></div>
      </div>
      <div class="pb-words"><span class="pb-mut">Amount in words:</span> ${esc(pbRupeesWords(T.total))}</div>
      ${pbStr(d.notes) ? `<div class="pb-notes"><b>Notes</b><br>${esc(d.notes)}</div>` : ''}
      ${!paid && (upi || acct) ? `<div class="pb-notes"><b>Payment details</b><br>${upi?`UPI: ${esc(upi)}`:''}${upi&&acct?'<br>':''}${acct?`Bank: ${esc(pbStr(s.account_name) || sname)}, A/c ${esc(acct)}${pbStr(s.ifsc)?', IFSC '+esc(s.ifsc):''}${pbStr(s.bank_name)?', '+esc(s.bank_name):''}`:''}</div>` : ''}
      <div class="pb-foot"><span>Sent through Boli · boli.ourdreamwork.com</span>${T.type==='none' && !gstin ? '<span>Supplier not registered under GST</span>' : ''}</div>
    </article>
    ${pay}
  </div>`;
}

/* lazy QR: fills #pbQr whenever it is on the page */
let pbQrLib = null;
function pbLoadQr(){
  if(pbQrLib) return pbQrLib;
  pbQrLib = new Promise((res)=>{
    if(typeof window.qrcode === 'function') return res(true);
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'; sc.async = true;
    sc.onload = ()=>res(typeof window.qrcode === 'function'); sc.onerror = ()=>res(false);
    document.head.appendChild(sc);
    setTimeout(()=>res(typeof window.qrcode === 'function'), 8000);
  });
  return pbQrLib;
}
function pbFillQr(){
  const el = document.getElementById('pbQr');
  if(!el || el.dataset.done) return;
  el.dataset.done = '1';
  const data = el.dataset.upi || '';
  pbLoadQr().then(ok=>{
    if(!ok || !el.isConnected) return;
    try{ const qr = window.qrcode(0, 'M'); qr.addData(data); qr.make(); el.innerHTML = qr.createSvgTag({cellSize:4, margin:2, scalable:true}); }catch(e){ el.innerHTML = ''; }
  });
}
(function(){
  const start = ()=>{ const v = document.getElementById('view'); if(!v) return; new MutationObserver(()=>{ if(document.getElementById('pbQr')) pbFillQr(); }).observe(v, {childList:true, subtree:true}); };
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

async function openAgreement(token){
  const st = pbState();
  st.agr = {token: pbStr(token), d:null, loading:true, err:''};
  S.view = 'a'; S.arg = token; render(); window.scrollTo(0,0);
  let d = null;
  try{ const r = await sb.rpc('public_agreement', {p_token: pbStr(token)}); d = r && !r.error ? r.data : null; }catch(e){ d = null; }
  if(S.view !== 'a' || S.arg !== token) return;
  st.agr = {token: pbStr(token), d: d && typeof d === 'object' ? d : null, loading:false, err:''};
  render(); window.scrollTo(0,0);
}
function vAgreement(){
  const st = pbState(), A = st.agr;
  if(!A || A.loading) return `<div class="pb-wrap"><p class="meta">Loading agreement…</p></div>`;
  const d = A.d;
  if(!d) return `<div class="pb-wrap"><div class="panel"><h2>This agreement is not available</h2><p class="meta">It may have been withdrawn, or the link is incomplete. Please check with the person who sent it.</p><div><button class="btn" data-act="home">Go to Boli</button></div></div></div>`;
  const t = d.terms && typeof d.terms === 'object' ? d.terms : {};
  const creator = pbStr(d.creator_name) || 'Creator', brand = pbStr(t.brand_name) || 'Brand';
  const accepted = d.status === 'accepted';
  const brandBlock = accepted
    ? `<div class="pb-sign"><span class="meta">For ${esc(brand)}</span><span class="pb-sig">${esc(d.brand_signed_name)}</span><span class="meta">Accepted on ${esc(pbDate(d.brand_signed_at))}</span></div>`
    : `<div class="pb-sign"><span class="meta">For ${esc(brand)}</span><span class="meta">Not accepted yet</span></div>`;
  const form = accepted ? `<div class="panel pb-noprint"><span class="tag ok" style="align-self:flex-start">Accepted</span><p>This agreement was accepted by ${esc(d.brand_signed_name)} for ${esc(brand)} on ${esc(pbDate(d.brand_signed_at))}. Both sides can keep this page as a record, or save it as a PDF.</p></div>`
    : d.status === 'sent' ? `<form id="pubAgrForm" class="panel pb-form pb-noprint" novalidate>
        <h2>Accept this agreement</h2>
        <label for="pubAgrName">Your full name<input id="pubAgrName" maxlength="80" autocomplete="name"></label>
        <label for="pubAgrEmail">Your work email<input id="pubAgrEmail" type="email" maxlength="120" autocomplete="email" inputmode="email"></label>
        <label for="pubAgrOk" class="pb-check"><input id="pubAgrOk" type="checkbox"> I accept this agreement on behalf of ${esc(brand)}.</label>
        <p class="pb-err" id="pubAgrErr" ${A.err?'':'hidden'}>${esc(A.err)}</p>
        <div><button class="btn accent" type="submit">Accept agreement</button></div>
        <p class="meta">Typing your name and accepting here counts as your signature. ${esc(pbFirst(creator))} will get an email when you accept.</p>
      </form>` : '';
  return `<div class="pb-wrap pb-agrprint">
    <div class="pb-bar pb-noprint"><span class="eyebrow">Collaboration agreement</span><div class="pb-acts"><button class="pill" data-act="pub-print">Print or save as PDF</button></div></div>
    <div class="panel pb-agr">
      <div class="row" style="flex-wrap:wrap"><h1 style="font-size:clamp(1.6rem,5vw,2.2rem)">Collaboration agreement</h1>${accepted?'<span class="tag ok">Accepted</span>':'<span class="tag">Awaiting acceptance</span>'}</div>
      <p class="meta">${esc(creator)} and ${esc(brand)}${pbStr(t.title)?' · '+esc(t.title):''}</p>
      ${agreementText(t, {creator, brand})}
      <div class="pb-signs">
        <div class="pb-sign"><span class="meta">Creator</span><span class="pb-sig">${esc(creator)}</span><span class="meta">${d.creator_signed_at?'Signed on '+esc(pbDate(d.creator_signed_at)):''}</span></div>
        ${brandBlock}
      </div>
      <p class="meta">Shared through Boli · boli.ourdreamwork.com</p>
    </div>
    ${form}
  </div>`;
}

/* ---------- "Work with me" enquiry on the public profile ---------- */
function kitEnquiryHTML(k){
  if(!k || !k.id) return '';
  const st = pbState(), e = st.enq[k.id] || {}, first = pbFirst(k.name);
  let inner;
  if(e.sent) inner = `<span class="tag ok" style="align-self:flex-start">Sent</span><p>${esc(first)} will reply to your email.</p>`;
  else if(!e.open) inner = `<p class="meta">Want ${esc(first)} to make content for your brand? Send a short enquiry. It goes straight to ${esc(first)}.</p><div><button class="btn accent" data-act="pub-enq-open" data-v="${esc(k.id)}">Send an enquiry</button></div>`;
  else inner = `<form id="pubEnqForm" class="pb-form" data-k="${esc(k.handle || k.id)}" data-id="${esc(k.id)}" novalidate>
      <label for="pubEnqBrand">Brand name<input id="pubEnqBrand" maxlength="100" autocomplete="organization" value="${esc(e.brand||'')}"></label>
      <label for="pubEnqName">Your name<input id="pubEnqName" maxlength="80" autocomplete="name" value="${esc(e.name||'')}"></label>
      <label for="pubEnqEmail">Email<input id="pubEnqEmail" type="email" maxlength="120" autocomplete="email" inputmode="email" value="${esc(e.email||'')}"></label>
      <label for="pubEnqPhone">Phone (optional)<input id="pubEnqPhone" type="tel" maxlength="20" autocomplete="tel" inputmode="tel" value="${esc(e.phone||'')}"></label>
      <label for="pubEnqBudget">Budget in ₹ (optional)<input id="pubEnqBudget" type="number" min="0" step="500" inputmode="numeric" value="${esc(e.budget||'')}"></label>
      <label for="pubEnqMsg">What would you like ${esc(first)} to make?<textarea id="pubEnqMsg" rows="4" maxlength="1000">${esc(e.msg||'')}</textarea></label>
      <div class="pb-hp" aria-hidden="true"><label for="pubEnqWeb">Website<input id="pubEnqWeb" tabindex="-1" autocomplete="off"></label></div>
      <p class="pb-err" id="pubEnqErr" ${e.err?'':'hidden'}>${esc(e.err||'')}</p>
      <div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn accent" type="submit">Send enquiry</button><button type="button" class="pill" data-act="pub-enq-close" data-v="${esc(k.id)}">Cancel</button></div>
      <p class="meta">${esc(first)} sees your name, email and phone so they can reply.</p>
    </form>`;
  return `<div class="panel pb-noprint" id="pubEnq" data-id="${esc(k.id)}"><h2>Work with ${esc(first)}</h2>${inner}</div>`;
}
function pbEnqKit(){ return (S.kit && S.kit.k) || (S.cr && S.cr.k) || null; }
function pbEnqRefresh(){
  const el = document.getElementById('pubEnq'), k = pbEnqKit();
  if(!el || !k) return;
  el.outerHTML = kitEnquiryHTML(k);
}

document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-act^="pub-"]'); if(!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v, st = pbState();
  if(a==='pub-print'){ window.print(); return; }
  if(a==='pub-pay'){ if(typeof window.boliPayInvoice === 'function') window.boliPayInvoice(v); else toast('Online payment is not available yet. Please use UPI or bank transfer.'); return; }
  if(a==='pub-enq-open'){ st.enq[v] = {...(st.enq[v]||{}), open:true, err:''}; pbEnqRefresh(); const f=document.getElementById('pubEnqBrand'); if(f) f.focus(); return; }
  if(a==='pub-enq-close'){ st.enq[v] = {...(st.enq[v]||{}), open:false, err:''}; pbEnqRefresh(); return; }
});
document.addEventListener('input', ev=>{
  const id = ev.target.id; if(!/^pubEnq/.test(id)) return;
  const f = document.getElementById('pubEnqForm'); if(!f) return;
  const st = pbState(), e = st.enq[f.dataset.id] = st.enq[f.dataset.id] || {open:true};
  const map = {pubEnqBrand:'brand', pubEnqName:'name', pubEnqEmail:'email', pubEnqPhone:'phone', pubEnqBudget:'budget', pubEnqMsg:'msg'};
  if(map[id]) e[map[id]] = ev.target.value;
});
document.addEventListener('submit', ev=>{
  const f = ev.target, id = f.id;
  if(id !== 'pubAgrForm' && id !== 'pubEnqForm') return;
  ev.preventDefault();
  const st = pbState();
  if(id === 'pubAgrForm') return run(async()=>{
    const A = st.agr; if(!A) return;
    const name = pbStr($('pubAgrName').value), email = pbStr($('pubAgrEmail').value), ok = $('pubAgrOk').checked;
    const err = name.length < 2 || !pbEmailOk(email) ? 'Add your name and a valid email.' : !ok ? 'Tick the box to accept on behalf of the brand.' : '';
    const pe = $('pubAgrErr');
    if(err){ pe.textContent = err; pe.hidden = false; return; }
    pe.hidden = true;
    const r = await sb.rpc('accept_agreement', {p_token: A.token, p_name: name, p_email: email});
    if(r.error){ pe.textContent = r.error.message || 'Could not accept. Please try again.'; pe.hidden = false; return; }
    if(r.data && typeof r.data === 'object') A.d = r.data;
    else if(A.d){ A.d = {...A.d, status:'accepted', brand_signed_name:name, brand_signed_email:email, brand_signed_at:new Date().toISOString()}; }
    render(); window.scrollTo(0,0); toast('Agreement accepted');
  });
  if(id === 'pubEnqForm') return run(async()=>{
    const kid = f.dataset.id, key = f.dataset.k, e = st.enq[kid] = st.enq[kid] || {open:true};
    const val = x => pbStr($(x).value);
    e.brand = val('pubEnqBrand'); e.name = val('pubEnqName'); e.email = val('pubEnqEmail'); e.phone = val('pubEnqPhone'); e.budget = val('pubEnqBudget'); e.msg = val('pubEnqMsg');
    const showErr = m => { e.err = m; const pe = $('pubEnqErr'); if(pe){ pe.textContent = m; pe.hidden = false; } };
    if(!e.brand) return showErr('Add your brand name.');
    if(!e.name) return showErr('Add your name.');
    if(!pbEmailOk(e.email)) return showErr('Add a valid email so the creator can reply.');
    if(!e.msg) return showErr('Tell the creator what you would like them to make.');
    if(e.phone && !/^[+0-9 ()-]{6,20}$/.test(e.phone)) return showErr('Check the phone number.');
    const budget = e.budget === '' ? null : Math.max(0, Math.round(Number(e.budget)) || 0);
    e.err = '';
    if(val('pubEnqWeb')){ e.sent = true; e.open = false; pbEnqRefresh(); return; }
    const r = await sb.rpc('submit_enquiry', {p_key: key, p_brand: e.brand, p_contact: e.name, p_email: e.email, p_phone: e.phone || null, p_message: e.msg, p_budget: budget});
    if(r.error || r.data === false) return showErr(r.error ? (r.error.message || 'Could not send. Please try again.') : 'This creator is not taking enquiries right now.');
    e.sent = true; e.open = false; pbEnqRefresh();
  });
});
</script>

</body>
</html>
