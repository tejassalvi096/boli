<style>
/* Layout: calm creator-platform look. Big type hero with a fan of reel covers, one open-briefs grid of portrait
   covers filtered by chips, a single accent colour, a floating dock for navigation on phones. */
:root{
  --bg:#f4f4f7; --surface:#ffffff; --ink:#111118; --muted:#676774; --line:#e3e3ea;
  --accent:#f0431f; --on-accent:#ffffff; --accent-soft:#ffe8e1; --ok:#0f7a57; --chip:#eaeaf0;
  --h-food:#f76707; --h-home:#0ca678; --h-fashion:#9c36b5; --h-beauty:#e64980; --h-travel:#1c7ed6; --h-tech:#4c6ef5;
  --cover-ink:#ffffff; --cover-deep:#14141c;
  --display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c0c10; --surface:#17171d; --ink:#f3f3f6; --muted:#a2a2af; --line:#2a2a33;
  --accent:#ff6a4a; --on-accent:#1c0600; --accent-soft:#3a1911; --ok:#58d6a8; --chip:#23232b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0c0c10; --surface:#17171d; --ink:#f3f3f6; --muted:#a2a2af; --line:#2a2a33;
  --accent:#ff6a4a; --on-accent:#1c0600; --accent-soft:#3a1911; --ok:#58d6a8; --chip:#23232b; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.025em;line-height:1.08}
h1{font-size:clamp(2.1rem,6.4vw,3.6rem);font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hd{display:flex;align-items:center;gap:12px;padding-block:14px}
.logo{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.05em;background:none;border:0;padding:0}
.logo i{font-style:normal;color:var(--accent)}
.lang{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;white-space:nowrap}
.dnav{display:none;gap:2px;margin-left:8px}
.dnav button{background:none;border:0;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.dnav button[aria-current="page"]{color:var(--ink);background:var(--chip)}
.seg{margin-left:auto;display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px color-mix(in oklab,var(--ink) 14%,transparent)}
.langs{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:14px}
@media (min-width:820px){ .dnav{display:flex} }

main{display:flex;flex-direction:column;gap:44px;padding-block:20px 150px}
.meta{color:var(--muted);font-size:.88rem}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row > *{min-width:0}
.sec{display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{display:inline-block;text-align:center;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:999px;font-weight:600}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.wide{display:block;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--muted);font-weight:600;text-align:left}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:.9rem;font-weight:500;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill:disabled{color:var(--muted);cursor:default;background:transparent}
.panel{background:var(--surface);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tag{font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.ok{background:var(--chip);color:var(--ok)}

/* hero */
.hero{display:grid;gap:28px;align-items:center;padding-top:14px}
.hero p{font-size:1.1rem;color:var(--muted);max-width:34ch}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.fan{display:flex;justify-content:center;padding:14px 0 6px}
.fan .cover{width:34%;max-width:170px;flex:none;box-shadow:0 18px 40px -18px color-mix(in oklab,var(--cover-deep) 55%,transparent)}
.fan .cover:nth-child(1){transform:rotate(-7deg) translateY(10px);margin-right:-6%}
.fan .cover:nth-child(2){z-index:1;transform:translateY(-8px)}
.fan .cover:nth-child(3){transform:rotate(7deg) translateY(10px);margin-left:-6%}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;list-style:none;margin:0;padding:18px 0 0;border-top:1px solid var(--line);font-weight:500}
.facts li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:10px;vertical-align:middle}

/* covers and cards */
.t-food{--hue:var(--h-food)} .t-home{--hue:var(--h-home)} .t-fashion{--hue:var(--h-fashion)} .t-beauty{--hue:var(--h-beauty)} .t-travel{--hue:var(--h-travel)} .t-tech{--hue:var(--h-tech)}
.cover{position:relative;display:block;width:100%;aspect-ratio:4/5;border:0;border-radius:20px;overflow:hidden;padding:0;color:var(--cover-ink);text-align:left;
  background:radial-gradient(120% 80% at 20% 0%,color-mix(in oklab,var(--hue) 70%,var(--cover-ink)) 0%,transparent 60%),linear-gradient(165deg,var(--hue) 10%,color-mix(in oklab,var(--hue) 45%,var(--cover-deep)) 100%)}
.cover .glass{position:absolute;left:10px;top:10px;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in oklab,var(--cover-ink) 22%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cover .cv{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:1px}
.cover .cv b{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.03em;line-height:1.05}
.cover .cv span{font-size:.82rem;opacity:.9}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:22px 14px}
@media (min-width:820px){ .grid{grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:28px 20px} }
.bc{display:flex;flex-direction:column;gap:10px;min-width:0}
.bc-t{background:none;border:0;padding:0;text-align:left;font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.25;letter-spacing:-.01em}
.search{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 18px;width:100%;max-width:340px}

/* course banner */
.course{background:var(--ink);color:var(--bg);border-radius:28px;padding:28px 24px;display:grid;gap:18px;align-items:center}
.course p{color:color-mix(in oklab,var(--bg) 72%,var(--ink))}
.course .eyebrow{color:var(--accent)}
@media (min-width:820px){ .course{grid-template-columns:1fr auto;padding:36px 40px} }

/* detail / tracker / course / forms */
.split{display:grid;gap:24px}
@media (min-width:820px){ .split{grid-template-columns:1fr 1fr;align-items:start;gap:40px} .split.narrow{grid-template-columns:320px 1fr} }
ol.steps{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv span:last-child{text-align:right;color:var(--muted)}
.kv b{font-family:var(--display);font-size:1.3rem}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.track span{font-size:.76rem;color:var(--muted);border-top:4px solid var(--chip);border-radius:2px;padding-top:6px}
.track span.on{border-top-color:var(--ok);color:var(--ink);font-weight:600}
.big{font-family:var(--display);font-weight:800;font-size:2.6rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.price{font-family:var(--display);font-weight:800;font-size:2.4rem;letter-spacing:-.03em;line-height:1}
.price s{font-weight:500;font-size:1.1rem;color:var(--muted);margin-right:10px;letter-spacing:0}
.bar{height:8px;background:var(--chip);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.wk{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;padding:16px 0;border-bottom:1px solid var(--line)}
.wk .num{font-family:var(--display);font-weight:800;font-size:1.7rem;color:var(--accent);line-height:1;letter-spacing:-.03em}
.wk > button{grid-column:2;background:none;border:0;padding:0;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wk .ls{grid-column:2;display:flex;flex-direction:column}
.lesson{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;background:none;border:0;text-align:left;width:100%}
.lesson:disabled{color:var(--muted);cursor:default}
.lesson .st{font-size:.78rem;color:var(--muted);white-space:nowrap;font-weight:600}
.lesson.done .st{color:var(--ok)}
label{display:flex;flex-direction:column;gap:5px;font-size:.86rem;font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.person .av{flex:none;width:44px;height:44px;border-radius:50%;background:linear-gradient(160deg,var(--hue),color-mix(in oklab,var(--hue) 45%,var(--cover-deep)));color:var(--cover-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.person div{flex:1;min-width:0}
.proto{font-size:.8rem;color:var(--muted);text-align:center}

.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:600}
.fbtn[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.fbtn em{font-style:normal;background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:.72rem;padding:1px 7px}
.achip{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:8px 14px;font-size:.88rem;font-weight:600}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:18px}
.fgroup{display:flex;flex-direction:column;gap:9px}
.fgroup > span{font-size:.74rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select{width:auto;max-width:100%;border-radius:999px;padding:7px 12px;background:var(--surface);font-size:.9rem;font-weight:500}
.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;font-size:.9rem}
.chk input{width:auto}
.lv{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:14px}
.lv.on{border-color:var(--accent);background:var(--accent-soft)}
.hook{background:var(--chip);border-radius:14px;padding:10px 14px;font-weight:500}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.08em;background:var(--chip);padding:4px 10px;border-radius:8px;color:var(--ink)}
.meter{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--chip);margin-top:8px}
.meter i{display:block;height:100%}
.meter i:nth-child(1){background:var(--accent)} .meter i:nth-child(2){background:var(--h-travel)} .meter i:nth-child(3){background:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat div{background:var(--bg);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.35rem;letter-spacing:-.02em}
.stat span{font-size:.8rem;color:var(--muted)}
.lock{border:1.5px dashed var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.dock div{pointer-events:auto;display:flex;gap:4px;background:var(--ink);border-radius:999px;padding:6px;box-shadow:0 14px 34px -12px color-mix(in oklab,var(--cover-deep) 60%,transparent)}
.dock button{background:none;border:0;color:color-mix(in oklab,var(--bg) 70%,var(--ink));padding:10px 18px;border-radius:999px;font-weight:600;font-size:.92rem;white-space:nowrap}
.dock button[aria-current="page"]{background:var(--bg);color:var(--ink)}
.dock em{font-style:normal;background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:.72rem;padding:1px 7px;margin-left:6px}
@media (min-width:820px){ .dock{display:none} main{padding-bottom:80px} }
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 74px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:9;max-width:calc(100% - 32px)}

html{-webkit-text-size-adjust:100%} body{margin:0} [hidden]{display:none!important} img{max-width:100%}
a.pill{text-decoration:none;color:inherit;display:inline-block}

#msgForm input{flex:1}
.tdesc{display:flex;flex-direction:column;gap:8px}
.tdesc button{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;flex-direction:column;gap:2px}
.tdesc button b{font-family:var(--display);font-size:1rem}
.tdesc button span{color:var(--muted);font-size:.88rem;font-weight:400}
.tdesc button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

body.busy #view [data-act],body.busy #view button[type=submit]{pointer-events:none;opacity:.55}

.pubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 24px}
.pubc{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;align-items:flex-start}
.pubc .pubt{flex:1;min-width:0;overflow-wrap:anywhere}
</style>

async function doLoad0(){
  const uid = S.user ? S.user.id : null;
  const [briefsR, bstatsR, meR] = await Promise.all([
    q(sb.from('briefs').select('*').eq('status','open').order('created_at',{ascending:false})),
    q(sb.rpc('brand_stats')),
    uid ? q(sb.from('profiles').select(PSEL).eq('id',uid).maybeSingle()) : null, loadWork()]);
  const N = {briefs: briefsR.filter(b=>!expired(b) && !b.draft), bstats:{}, me: meR||null, apps:[], mine:[], creators:[], stats:{}, del:{}, alerts:true, alertsOk:false, invites:[], samples:[]};
  bstatsR.forEach(r=>{ N.bstats[r.brand_id]=r.paid; });
  if(N.me){
    const creator = N.me.role==='creator';
    const [al, cs, dl, iv, sm, x1, x2, x3] = await Promise.all([
      sb.from('profiles').select('email_alerts').eq('id',uid).maybeSingle().then(r=>r, ()=>({error:true})),
      q(sb.rpc('creator_stats')),
      q(sb.from('deliveries').select('*')),
      S.cap.invites ? sb.from('invites').select('*').then(r=>r.error ? [] : (r.data||[]), ()=>[]) : [],
      S.cap.kit && creator ? sb.from('samples').select('*').eq('creator_id',uid).order('created_at',{ascending:false}).then(r=>r.error ? [] : (r.data||[]), ()=>[]) : [],
      ...(creator ? [q(sb.rpc('my_links')), q(sb.from('applications').select('*, briefs(*)').eq('creator_id',uid).order('created_at',{ascending:false}))]
        : [q(sb.from('briefs').select('*, applications(*, profiles('+PSEL+'))').eq('brand_id',uid).order('created_at',{ascending:false})), q(sb.rpc('applicant_links')), q(sb.from('profiles').select(PSEL).eq('role','creator').order('followers',{ascending:false}))])]);
    if(al && !al.error && al.data){ N.alertsOk = true; N.alerts = al.data.email_alerts!==false; }
    cs.forEach(r=>{ N.stats[r.creator_id]=r; });
    dl.forEach(d=>{ N.del[d.application_id]=d; });
    N.invites = Array.isArray(iv) ? iv : [];
    N.samples = Array.isArray(sm) ? sm : [];
    if(creator){ const l = x1[0] || {}; N.me.social = l.social; N.me.sample_link = l.sample_link; N.apps = x2; }
    else { const links = {}; x2.forEach(r=>{ links[r.application_id]=r; }); N.mine = x1; N.mine.forEach(b=>(b.applications||[]).forEach(a=>{ a.links = links[a.id]||{}; })); N.creators = x3; }
  }
  N.billing = null; N.studioSum = null;
  if(N.me && N.me.role==='creator' && S.cap.studio){
    const tol = p => Promise.resolve().then(()=>p).then(r=>r, ()=>({error:true}));
    const [bl, ss] = await Promise.all([tol(sb.from('billing').select('*').eq('creator_id',uid).maybeSingle()), tol(sb.rpc('studio_summary'))]);
    N.billing = bl && !bl.error ? (bl.data||null) : null;
    N.studioSum = ss && !ss.error && ss.data && typeof ss.data==='object' ? ss.data : null;
  }
  if((S.user ? S.user.id : null) !== uid) return;
  Object.assign(S, N);
}

/* ---------- routing: #/  #/brief/<id>  #/work  #/dash  #/find  #/account  #/profile  #/auth  #/thread/<id>  #/admin  #/terms ---------- */
let routeReady = false, routeSeq = 0;
const hashFor = (view, arg) => '#/' + (view==='home' ? '' : view) + (arg!=null && arg!=='' ? '/' + encodeURIComponent(arg) : '');
const curHash = () => location.hash.startsWith('#/') ? location.hash : '#/';
function setHash(view, arg){ try{ history.replaceState(history.state, '', location.pathname + location.search + hashFor(view, arg)); }catch(e){} }
function go(view, arg){
  const h = hashFor(view, arg===undefined ? null : arg);
  if(!routeReady || h===curHash()){ if(location.hash!==h && routeReady) setHash(view, arg); return route(); }
  location.hash = h;
}
async function route(){
  if(!routeReady) return;
  const seq = ++routeSeq;
  try{
    if(location.hash && !location.hash.startsWith('#/')) setHash('home');
    const parts = curHash().slice(2).split('/');
    let view = parts[0] || 'home', arg = parts[1] ? decodeURIComponent(parts[1]) : null;
    const to = (v, a) => { view = v; arg = a===undefined ? null : a; setHash(view, arg); };
    if(!ROUTES.includes(view)) to('home');
    if(view==='reset' && !S.user){ S.authMode = 'in'; S.authNote = 'Open the reset link from your email again, or ask for a new one below.'; to('auth'); }
    if(view==='forgot' && S.user) to(S.me ? (isBrand() ? 'dash' : 'home') : 'profile');
    if(S.user && !S.me && !['profile','terms','reset','c','i','a'].includes(view)) to('profile');
    if(view==='profile' && !S.user) to('auth');
    if(view==='auth' && S.user) to(S.me ? (isBrand() ? 'dash' : 'home') : 'profile');
    if(['work','dash','find','account','thread','admin','creator','edit','studio'].includes(view) && !S.me) to(S.user ? 'profile' : 'home');
    if(view==='studio' && !(isCreator() && S.cap.studio && typeof openStudio==='function')) to('home');
    if(view==='admin' && !(S.me && S.me.is_admin && typeof openAdmin==='function')) to('home');
    if(view==='creator' && !(arg && (isBrand() || (S.me && S.me.is_admin)) && typeof openCreator==='function')) to(isBrand() ? 'find' : 'home');
    if(view==='edit' && !(isBrand() && arg && S.mine.some(b=>b.id===arg))) to(isBrand() ? 'dash' : 'home');
    if((view==='dash' || view==='find') && !isBrand()) to('home');
    if(view==='work' && !isCreator()) to(isBrand() ? 'dash' : 'home');
    if((view==='brief' || view==='thread') && !arg) to('home');
    if(view==='brief' && !briefById(arg) && !(arg in S.extra)){
      let b = null; try{ b = await q(sb.from('briefs').select('*').eq('id', arg).maybeSingle()); }catch(e){ b = null; }
      S.extra[arg] = b || null;
      if(seq!==routeSeq) return;
    }
    if(view==='thread'){
      if(typeof openThread==='function') return await openThread(arg);
      S.msgs = await q(sb.from('messages').select('*').eq('application_id', arg).order('created_at'));
      if(seq!==routeSeq) return;
    }
    if(view==='admin') return await openAdmin();
    if(view==='creator') return await openCreator(arg);
    if(view==='c'){ if(arg && typeof openKit==='function') return await openKit(arg); to('home'); }
    if(view==='studio') return await openStudio(STUDIO_TABS.includes(arg) ? arg : 'board');
    if(view==='i'){ if(arg && typeof openInvoice==='function') return await openInvoice(arg); to('home'); }
    if(view==='a'){ if(arg && typeof openAgreement==='function') return await openAgreement(arg); to('home'); }
    if(view!=='auth') S.authNote = '';
    if(view!=='account') S.pwOpen = false;
    if(view!=='forgot') S.forgotSent = '';
    S.view = view; S.arg = arg; render(); window.scrollTo(0,0);
  }catch(e){ toast(e.message || 'Something went wrong. Please try again.'); }
}
async function shareBrief(id){
  const b = briefById(id) || {}, link = location.origin + '/#/brief/' + id;
  if(navigator.share){ try{ await navigator.share({title:'Boli', text:(b.brand_name ? b.brand_name + ' is looking for creators on Boli. ' : '') + (b.title||''), url:link}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(link); toast('Link copied'); }
  catch(e){ const t = document.createElement('textarea'); t.value = link; t.setAttribute('readonly',''); t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); let done = false; try{ done = document.execCommand('copy'); }catch(_){} t.remove(); toast(done ? 'Link copied' : link); }
}

    if(title.length<3) return showErr('eErr','Add a title for the brief.');
    const patch = {title, city:$('eCity').value};
    if(S.cap.briefs) Object.assign(patch, briefExtraVals('e'));
    await q(sb.from('briefs').update(patch).eq('id', bid)); delete S.extra[bid];
    await loadAll(); toast('Brief updated'); go('dash');
  });
  if(id==='vidForm') return run(async()=>{
    const link=fixUrl($('vLink').value); if(!url(link)) return toast('Paste the full link to your video.');
    await q(sb.from('applications').update({status:'sent', video_link:link}).eq('id', myApp(S.arg).id)); await loadAll(); render(); toast('Video sent to the brand');
  });
  if(id==='delForm') return run(async()=>{
    const recipient=$('dName').value.trim(), address=$('dAddr').value.trim(), phone=$('dPhone').value.trim();
    if(!recipient || address.length<5 || phone.length<6) return toast('Add your name, full address and a phone number.');
    await q(sb.from('deliveries').insert({application_id:myApp(S.arg).id, creator_id:S.user.id, recipient, address, phone})); await loadAll(); render(); toast('Delivery details sent to the brand');
  });
  if(id==='msgForm') return run(async()=>{
    const body=$('mBody').value.trim(); if(!body) return;
    await q(sb.from('messages').insert({application_id:S.arg, sender_id:S.user.id, body}));
    S.msgs = await q(sb.from('messages').select('*').eq('application_id',S.arg).order('created_at')); render(); $('mBody').focus();
  });
  if(id==='briefForm') return run(async()=>{
    const title=$('fAsk').value.trim(); if(title.length<3) { $('fErr').hidden=false; return; }
    const nb = {brand_id:S.user.id, brand_name:S.me.name, title, cat:$('fCat').value, city:$('fCity').value, min_followers:+$('fMin').value, creators_needed:Math.max(1,+$('fNum').value||1)};
    if(S.tpl==='simple' || S.tpl==='product' || S.tpl==='both'){
      nb.type=S.ft; nb.comp = S.tpl==='simple' ? 'pay' : S.tpl; nb.pay = S.tpl==='product' ? 0 : Math.max(100,+$('fPay').value||0);
      if(S.tpl!=='simple'){ const pn=$('fProd').value.trim(); if(!pn) return showErr('fErr','Say which product you will send.'); nb.product_note=pn; nb.product_value=Math.max(0,+$('fProdV').value||0); }
    }
    else {
      nb.type='affiliate'; nb.pay=0; nb.comm=Math.min(50,Math.max(1,+$('fComm').value||10)); nb.min_videos=Math.max(0,+$('fVid').value||0);
      nb.hooks=$('fHooks').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,8);
      if(S.tpl==='full'){
        const up=Math.max(500,+$('fUp').value||2500), ret=Math.max(0,+$('fRet').value||0);
        nb.levels=[{n:'Starter',at:0,c:nb.comm,r:0},{n:'Rising',at:up,c:Math.min(50,nb.comm+2),r:Math.round(ret/300)*100},{n:'Partner',at:up*4,c:Math.min(50,nb.comm+5),r:ret}];
        const ct=+$('fChT').value||0, cb=+$('fChB').value||0; if(ct&&cb) nb.challenge={t:'Sell '+rs(ct)+' this month', bonus:cb};
      }
    }
    if(S.cap.briefs) Object.assign(nb, briefExtraVals('f'));
    await q(sb.from('briefs').insert(nb)); S.fa=''; $('fAsk').value=''; S.bfClear=true; await loadAll(); render(); toast(S.workOpen ? 'Brief posted. Creators can see it now.' : 'Saved as a draft');
  });
});

function afterLogin(){
  let c = S.pendC; S.pendC = null;
  try{ if(!c) c = localStorage.getItem('boli_pendC'); localStorage.removeItem('boli_pendC'); }catch(_){}
  if(c && isBrand()) return go('creator', c);
  const p=S.pend; S.pend=null; if(p && isCreator()) return go('brief', p); go(isBrand()?'dash':'home');
}

(async function start(){
  try{
    /* getSession resolves only after supabase-js has read any sign-in tokens from the address, so the hash is left alone until then. */
    const [{data:{session}}] = await Promise.all([sb.auth.getSession(), probeCaps(), loadWork()]); S.user = session ? session.user : null;
    await loadAll();
  }catch(e){ $('view').innerHTML = '<p class="meta">Boli could not load. Check your connection and refresh the page.</p>'; return; }
  routeReady = true;
  const linkErr = /[#&]error(_code|_description)?=/.test(BOOT.hash), fromConfirm = /[#&]type=(signup|email|invite)(&|$)/.test(BOOT.hash);
  if(linkErr && !S.user){ S.authMode = 'in'; S.authNote = 'That link has expired or was already used. Sign in, or ask for a new link below.'; setHash('auth'); }
  else if(BOOT.recover && S.user) setHash('reset');
  else if(!location.hash.startsWith('#/')) setHash(S.user && S.me && isBrand() ? 'dash' : 'home');
  if(fromConfirm && S.user && !linkErr) setTimeout(()=>toast('Email confirmed. Welcome to Boli.'), 300);
  window.addEventListener('hashchange', route);
  route();
})();
</script>

<script>
/* ---------- deal thread, dashboard row and deal notes (part B) ---------- */
const T_REFS = 'https://logstpicpmemtbjuxfvk.supabase.co/storage/v1/object/public/refs/';
const T_LINK = /^https:\/\/(www\.)?(instagram\.com\/(reel|reels|p)\/|youtube\.com\/(watch|shorts)|youtu\.be\/|drive\.google\.com\/)/i;
let tPoll = null;
const tTime = d => new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const tInThread = id => S.view==='thread' && S.arg===id && S.th;
const tCanRef = () => !!(S.th && S.user && (S.th.admin || (S.me && S.me.is_admin) || (S.th.b && S.th.b.brand_id===S.user.id)));

async function tDeal(id){
  const f = findApp(id);
  if(f) return {a:f.a, b:f.b||{}, other:f.other, admin:false, brandName:(f.b||{}).brand_name, creatorName:(f.a.profiles||{}).name || (S.me&&S.me.role==='creator'?S.me.name:'')};
  if(S.me && S.me.is_admin){
    const a = await q(sb.from('applications').select('*, briefs(*), profiles(id,name)').eq('id',id).maybeSingle());
    if(a) return {a, b:a.briefs||{}, other:((a.briefs||{}).brand_name||'Brand')+' ↔ '+((a.profiles||{}).name||'Creator'), admin:true, brandName:(a.briefs||{}).brand_name, creatorName:(a.profiles||{}).name};
  }
  return null;
}
const tMsgs = id => q(sb.from('messages').select('*').eq('application_id',id).order('created_at'));
function tBottom(){ const l=$('tList'); if(l) l.scrollTop = l.scrollHeight; }
function tRender(keepFocus){
  const el = $('tBody'), had = keepFocus && el && document.activeElement===el;
  render();
  const n = $('tBody'); if(n && had){ n.focus(); try{ n.setSelectionRange(n.value.length, n.value.length); }catch(e){} }
  tBottom();
}

async function openThread(id){
  try{
    if(!S.user || !S.me){ S.view='home'; S.arg=null; render(); return; }
    const th = await tDeal(id);
    S.msgs = th ? await tMsgs(id) : [];
    if(!tInThread(id)){ S.thDraft=''; S.thRef=false; }
    S.th = th; S.view='thread'; S.arg=id; render(); window.scrollTo(0,0); tBottom();
  }catch(e){ S.th=null; S.msgs=[]; S.view='thread'; S.arg=id; render(); toast(e.message||'Could not open this conversation.'); }
  clearInterval(tPoll);
  tPoll = setInterval(async()=>{
    if(!tInThread(id)){ clearInterval(tPoll); tPoll=null; return; }
    if(document.hidden) return;
    try{
      const ms = await tMsgs(id); if(!tInThread(id)) return;
      if(ms.length===S.msgs.length) return;
      const hadEvent = ms.slice(S.msgs.length).some(m=>m.kind==='event');
      S.msgs = ms;
      if(hadEvent){ await loadAll(); const th = await tDeal(id); if(!tInThread(id)) return; if(th) S.th = th; tRender(true); }
      else { const l=$('tList'); if(l){ l.innerHTML = tListHTML(); tBottom(); } }
    }catch(e){}
  }, 12000);
}

function tWho(m){
  const t = S.th; if(m.kind==='team') return 'Boli team';
  if(m.sender_id===t.a.creator_id) return t.creatorName||'Creator';
  if(m.sender_id===t.b.brand_id) return t.brandName||'Brand';
  return 'Boli team';
}
function tAttach(m){
  const u = url(m.attachment_url); if(!u) return '';
  if(u.indexOf(T_REFS)===0) return `<a href="${esc(u)}" target="_blank" rel="noopener" aria-label="Open reference image"><img class="th-img" src="${esc(u)}" alt="Reference image" loading="lazy"></a>`;
  if(T_LINK.test(u)) return `<a class="pill" href="${esc(u)}" target="_blank" rel="noopener">Reference link</a>`;
  return '';
}
function tListHTML(){
  const t = S.th; if(!t) return '';
  return (S.msgs||[]).map(m=>{
    if(m.kind==='event') return `<p class="th-ev">${esc(m.body)} · ${tTime(m.created_at)}</p>`;
    const me = m.sender_id===S.user.id, team = m.kind==='team';
    const who = team ? 'Boli team' : (t.admin && !me ? tWho(m) : '');
    return `<div class="th-m${me?' me':''}${team?' team':''}">${who?`<span class="th-who">${esc(who)}</span>`:''}${tAttach(m)}<p class="hook">${esc(m.body)}</p><span class="th-time">${tTime(m.created_at)}</span></div>`;
  }).join('') || '<p class="meta">No messages yet. Say hello and agree the details here.</p>';
}

function tDealBar(t){
  const a = t.a, b = t.b, s = a.status, mine = S.user && a.creator_id===S.user.id, owner = S.user && b.brand_id===S.user.id;
  if(!mine && !owner) return '';
  const done = lastStep(b)==='Completed', v = url(a.video_link);
  const watch = v ? `<a class="pill" href="${esc(v)}" target="_blank" rel="noopener noreferrer">Watch video</a>` : '';
  const btn = (st, label, on) => `<button class="pill" data-act="t-status" data-v="${esc(a.id)}" data-s="${st}"${on?' aria-pressed="true"':''}>${label}</button>`;
  let h = '';
  if(mine){
    if(s==='applied') h = `<p class="meta">Waiting for the brand to respond to your application.</p>`;
    else if(s==='accepted'){
      const needAddr = hasProduct(b) && !S.del[a.id];
      h = dealNotes(a, b) + (needAddr ? `<p class="meta">The brand needs your delivery details to send the product.</p><div><button class="pill" data-act="brief" data-v="${esc(b.id)}">Add delivery details</button></div>` : '')
        + `<form id="tVidForm" class="sec" novalidate><label for="tVid">Send your finished video<input id="tVid" inputmode="url" placeholder="Paste the link to your video" value="${esc(a.video_link||'')}"></label><p class="meta">${hasProduct(b)?'Shoot once the product reaches you. ':''}Upload it to Google Drive, YouTube (unlisted) or Instagram and paste the link here.</p><div><button class="btn accent" type="submit">Send video to the brand</button></div></form>`;
    }
    else if(s==='sent') h = `<p class="meta">Your video is with the brand for review.</p><div class="th-tools">${watch}</div>`;
    else if(s==='approved') h = `<p class="meta">${done?'Approved. The brand will mark the deal as completed.':'Approved. Payment is the next step.'}</p>`;
    else if(s==='paid') h = `<p><span class="tag ok">${lastStep(b)}</span></p>`;
  } else {
    if(s==='applied'){
      const full = ((S.mine.find(x=>x.id===b.id)||{}).applications||[]).filter(x=>['accepted','sent','approved','paid'].includes(x.status)).length >= (b.creators_needed||1);
      h = `<p class="meta">${S.workOpen?'This creator has applied to your brief.':'You can accept creators once Boli opens for work.'}</p><div class="th-tools">${full?'<span class="tag">Brief is full</span>':S.workOpen?btn('accepted','Accept',1):''}${btn('declined','Decline')}</div>`;
    }
    else if(s==='accepted') h = `<p class="meta">${a.change_note?'You asked for changes: '+esc(a.change_note):'Waiting for the creator to send the video.'}</p>`;
    else if(s==='sent'){
      const open = same(S.tChg, a.id);
      h = `<p class="meta">The creator has sent the video.</p><div class="th-tools">${watch}${btn('approved','Approve video',1)}<button class="pill" data-act="t-changes" data-v="${esc(a.id)}" aria-expanded="${open}">Ask for changes</button></div>`
        + (open ? `<div class="sec"><label for="tChgTxt">What should the creator change?<textarea id="tChgTxt" rows="3" maxlength="500">${esc(S.tChgTxt||'')}</textarea></label><div class="th-tools"><button class="btn" data-act="t-changes-send" data-v="${esc(a.id)}">Send request</button><button class="pill" data-act="t-changes-cancel">Cancel</button></div></div>` : '');
    }
    else if(s==='approved') h = `<p class="meta">${done?'Video approved.':'Video approved. Payment is the next step.'}</p><div class="th-tools">${watch}${btn('paid', done?'Mark as completed':'Mark as paid', 1)}</div>`;
    else if(s==='paid') h = `<p><span class="tag ok">${lastStep(b)}</span></p><div class="th-tools">${watch}</div>`;
  }
  return h ? `<div class="panel" id="tDeal"><b>${mine?'Your next step':'This deal'}</b>${h}</div>` : '';
}
async function tSync(){ if(S.view==='thread' && S.arg){ const id=S.arg, th=await tDeal(id); if(th && tInThread(id)){ S.th=th; S.msgs=await tMsgs(id); } } }

function vThread(){
  const t = S.th;
  if(!t || !same(t.a.id, S.arg)) return `<p class="meta">This conversation is not available.</p>`;
  const a = t.a, b = t.b, party = !t.admin, isAdm = !!(S.me && S.me.is_admin);
  const back = t.admin ? `<button class="link" data-act="nav" data-v="admin">‹ Back to Boli team</button>`
    : (b.brand_id===S.user.id ? `<button class="link" data-act="nav" data-v="dash">‹ Back</button>` : `<button class="link" data-act="brief" data-v="${esc(b.id)}">‹ Back</button>`);
  const help = a.help_at
    ? `<span class="meta">The Boli team has been asked to help.</span>${isAdm?`<button class="pill" data-act="t-helpdone" data-v="${esc(a.id)}">Mark help as resolved</button>`:''}`
    : (party ? `<button class="pill" data-act="t-help" data-v="${esc(a.id)}">Need help? Ask Boli</button>` : '');
  const ref = tCanRef() ? `<button class="pill" data-act="t-attach" aria-expanded="${!!S.thRef}" aria-pressed="${!!S.thRef}">Add reference</button>` : '';
  return `<div class="sec" style="max-width:640px;margin:0 auto;width:100%">${back}
    <span class="eyebrow">${esc(b.title||'')}</span><h2>${t.admin?esc(t.other):'Messages with '+esc(t.other)}</h2>
    ${a.status==='declined'?'<span class="tag">Not selected</span>':track(a.status, b)}
    ${tDealBar(t)}
    <div class="panel">
      <div class="th-list" id="tList" aria-live="polite">${tListHTML()}</div>
      <p class="meta">Phone numbers, emails, links and social handles are hidden in messages. Keep the deal on Boli.</p>
      <form id="chatForm" class="th-form" novalidate><input id="tBody" maxlength="1000" autocomplete="off" value="${esc(S.thDraft||'')}" placeholder="${t.admin?'Write as Boli team':'Write a message'}" aria-label="Message"><button class="btn accent" type="submit">Send</button></form>
      ${ref||help?`<div class="th-tools">${ref}${help}</div>`:''}
      ${ref&&S.thRef?`<div class="lock th-ref">
        <label for="tFile">Reference image (JPG, PNG or WebP, up to 5 MB)<input id="tFile" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <label for="tLink">Or a reference link<input id="tLink" inputmode="url" placeholder="https://www.instagram.com/reel/…"></label>
        <p class="meta">Links can be an Instagram post, a YouTube video or a Google Drive file. Anything typed in the message box is sent along with it.</p>
        <div><button type="button" class="btn" data-act="t-link">Send link</button></div></div>`:''}
    </div></div>`;
}

async function tSend(body, attachment_url){
  const id = S.arg, row = {application_id:id, sender_id:S.user.id, body};
  if(attachment_url) row.attachment_url = attachment_url;
  await q(sb.from('messages').insert(row));
  S.thDraft = ''; S.msgs = await tMsgs(id);
  if(!tInThread(id)) return;
  if(attachment_url) S.thRef = false;
  render(); tBottom(); const n=$('tBody'); if(n) n.focus();
}

/* ---------- brand dashboard row ---------- */
function appRow(a, b){
  const c = a.profiles || {}, s = a.status, v = url(a.video_link), L = a.links || {}, soc = url(L.social), sm = url(L.sample_link);
  const done = lastStep(b)==='Completed', d = S.del[a.id];
  const lab = {applied:'Applied', accepted:a.change_note?'Changes requested':'Accepted, now shooting', declined:'Declined', sent:'Video received', approved:done?'Approved':'Approved, payment due', paid:lastStep(b)}[s];
  const btn = (st, t, on) => `<button class="pill" data-act="t-status" data-v="${esc(a.id)}" data-s="${st}"${on?' aria-pressed="true"':''}>${t}</button>`;
  const chgOpen = s==='sent' && same(S.tChg, a.id);
  const full = (b.applications||[]).filter(x=>['accepted','sent','approved','paid'].includes(x.status)).length >= (b.creators_needed||1);
  const acts = s==='applied' ? (full ? '<span class="tag">Brief is full</span>' : S.workOpen ? btn('accepted','Accept',1) : '')+btn('declined','Decline')
    : s==='sent' ? btn('approved','Approve video',1)+`<button class="pill" data-act="t-changes" data-v="${esc(a.id)}" aria-expanded="${chgOpen}">Ask for changes</button>`
    : s==='approved' ? btn('paid', done?'Mark as completed':'Mark as paid', 1) : '';
  const live = ['accepted','sent','approved','paid'].includes(s);
  const ship = hasProduct(b) && live ? (
    !d ? `<p class="meta" style="flex-basis:100%">Waiting for the creator’s delivery details.</p>`
    : `<p class="meta" style="flex-basis:100%">Send the product to: ${esc(d.recipient)}, ${esc(d.address)}, phone ${esc(d.phone)}</p>` + (a.shipped_at
      ? `<p class="meta" style="flex-basis:100%"><span class="tag ok">Shipped</span>${a.tracking?' Tracking: '+esc(a.tracking):''}</p>`
      : `<div class="th-box"><div class="th-inline"><input id="tTrk-${esc(a.id)}" maxlength="80" placeholder="Tracking number (optional)" aria-label="Tracking number, optional"><button class="pill" data-act="t-ship" data-v="${esc(a.id)}">Mark product shipped</button></div></div>`)) : '';
  return `<div class="person t-${hue((c.cats||[])[0])}" style="flex-wrap:wrap"><span class="av">${esc(ini(c.name))}</span><div><button type="button" class="link" style="color:inherit;font-weight:700" data-act="creator" data-v="${esc(c.id)}" aria-label="Open ${esc(c.name)}’s profile">${esc(c.name)}</button>${c.verified?' <span class="tag ok">Verified</span>':''}<br><span class="meta">${esc(c.city||'')}${c.area?', '+esc(c.area):''} · ${num(c.followers)} followers · ${rec(c.id)} · ${lab}</span></div>
    ${sm?`<a class="pill" href="${esc(sm)}" target="_blank" rel="noopener">Sample video</a>`:''}${soc?`<a class="pill" href="${esc(soc)}" target="_blank" rel="noopener">Their page</a>`:''}${v&&s!=='applied'?`<a class="pill" href="${esc(v)}" target="_blank" rel="noopener">Watch video</a>`:''}${acts}<button class="pill" data-act="thread" data-v="${esc(a.id)}">Messages</button>
    ${chgOpen?`<div class="th-box"><label for="tChgTxt">What should the creator change?<textarea id="tChgTxt" rows="3" maxlength="500" placeholder="e.g. Please reshoot the opening so the pack is visible.">${esc(S.tChgTxt||'')}</textarea></label><div class="th-inline"><button class="btn" data-act="t-changes-send" data-v="${esc(a.id)}">Send request</button><button class="link" data-act="t-changes-cancel">Cancel</button></div></div>`:''}
    ${s==='accepted'&&a.change_note?`<p class="meta" style="flex-basis:100%">You asked for changes: ${esc(a.change_note)}</p>`:''}
    ${ship}</div>`;
}

/* ---------- creator's brief page ---------- */
function dealNotes(a, b){
  if(!a) return '';
  return (a.status==='accepted' && a.change_note ? `<div class="lock"><b>The brand asked for changes</b><span>${esc(a.change_note)}</span><span class="meta">Update your video and send the new link below.</span></div>` : '')
    + (hasProduct(b) && a.shipped_at ? `<p class="meta"><span class="tag ok">Product shipped</span>${a.tracking?' Tracking: '+esc(a.tracking):''}</p>` : '');
}

/* ---------- events ---------- */
async function tAppUpdate(id, patch, msg){
  const y = window.scrollY;
  await q(sb.from('applications').update(patch).eq('id', id));
  await loadAll(); await tSync(); render(); window.scrollTo(0, y); toast(msg);
}
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act^="t-"]'); if(!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if(a==='t-status') return run(async()=>{
    const s = el.dataset.s, f = findApp(v), done = f && lastStep(f.b)==='Completed';
    if(same(S.tChg, v)){ S.tChg=null; S.tChgTxt=''; }
    await tAppUpdate(v, {status:s}, {accepted:'Creator accepted', declined:'Application declined', approved:'Video approved', paid:done?'Marked as completed':'Marked as paid'}[s]||'Updated');
  });
  if(a==='t-changes'){ const y=window.scrollY; if(same(S.tChg, v)){ S.tChg=null; } else { S.tChg=v; S.tChgTxt=''; } render(); window.scrollTo(0,y); const t=$('tChgTxt'); if(t) t.focus(); return; }
  if(a==='t-changes-cancel'){ const y=window.scrollY; S.tChg=null; S.tChgTxt=''; render(); window.scrollTo(0,y); return; }
  if(a==='t-changes-send') return run(async()=>{
    const t=$('tChgTxt'), note=(t?t.value:S.tChgTxt||'').trim();
    if(note.length<5) return toast('Tell the creator what to change.');
    await q(sb.from('applications').update({status:'accepted', change_note:note}).eq('id', v));
    const y=window.scrollY; S.tChg=null; S.tChgTxt=''; await loadAll(); await tSync(); render(); window.scrollTo(0,y); toast('Changes requested');
  });
  if(a==='t-ship') return run(async()=>{
    const t=$('tTrk-'+v), tracking=t?t.value.trim().slice(0,80):'';
    await tAppUpdate(v, {shipped_at:new Date().toISOString(), tracking:tracking||null}, 'Marked as shipped');
  });
  if(a==='t-help') return run(async()=>{ await q(sb.rpc('ask_help', {app:v})); await loadAll(); await openThread(v); toast('The Boli team has been asked to help'); });
  if(a==='t-helpdone') return run(async()=>{ await q(sb.rpc('admin_resolve_help', {app:v})); await loadAll(); await openThread(v); toast('Marked as resolved'); });
  if(a==='t-attach'){ S.thRef=!S.thRef; tRender(false); return; }
  if(a==='t-link') return run(async()=>{
    const t=$('tLink'), link=fixUrl(t?t.value:'');
    if(!T_LINK.test(link)) return toast('Reference links can be an Instagram post, a YouTube video or a Google Drive file.');
    await tSend((S.thDraft||'').trim() || 'Reference link', link);
  });
});
document.addEventListener('submit', e=>{
  if(e.target.id!=='tVidForm') return; e.preventDefault();
  run(async()=>{
    const link = fixUrl($('tVid').value); if(!url(link)) return toast('Paste the full link to your video.');
    await q(sb.from('applications').update({status:'sent', video_link:link}).eq('id', S.arg));
    await loadAll(); await tSync(); render(); toast('Video sent to the brand');
  });
});
document.addEventListener('input', e=>{
  if(e.target.id==='tBody') S.thDraft = e.target.value;
  else if(e.target.id==='tChgTxt') S.tChgTxt = e.target.value;
});
document.addEventListener('change', e=>{
  if(e.target.id!=='tFile') return;
  const file = e.target.files && e.target.files[0]; if(!file) return;
  run(async()=>{
    const ext = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];
    if(!ext){ e.target.value=''; return toast('Choose a JPG, PNG or WebP image.'); }
    if(file.size > 5*1024*1024){ e.target.value=''; return toast('The image must be 5 MB or smaller.'); }
    if(!tCanRef()) return;
    toast('Uploading image…');
    const path = S.user.id+'/'+crypto.randomUUID()+'.'+ext;
    const up = await sb.storage.from('refs').upload(path, file, {contentType:file.type});
    if(up.error) throw new Error(up.error.message||'The image could not be uploaded.');
    await tSend((S.thDraft||'').trim() || 'Reference image', sb.storage.from('refs').getPublicUrl(path).data.publicUrl);
    toast('Reference sent');
  });
});
document.addEventListener('submit', e=>{
  if(e.target.id!=='chatForm') return;
  e.preventDefault();
  run(async()=>{
    const t=$('tBody'), body=(t?t.value:S.thDraft||'').trim(); if(!body || !S.th) return;
    await tSend(body);
  });
});
</script>

<!-- part_admin -->
<style>
/* Boli team admin page */
.ad-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:820px){ .ad-tiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
.ad-tile{background:var(--surface);border-radius:18px;padding:14px 16px;min-width:0}
.ad-tile b{display:block;font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.ad-tile span{font-size:.82rem;color:var(--muted)}
.ad-tile.warn b{color:var(--accent)}
.ad-list{display:flex;flex-direction:column}
.ad-row{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line);min-width:0}
.ad-row:last-child{border-bottom:0}
.ad-row > *{min-width:0}
.ad-row b,.ad-row .meta{overflow-wrap:anywhere}
.ad-tags,.ad-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ad-acts .pill{white-space:normal;text-align:left}
.ad-acts a.pill{text-decoration:none;color:inherit}
.ad-inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.ad-inline input{width:130px;flex:none}
.ad-search{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 18px;width:100%;max-width:420px}
.ad-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
</style>
<script>
/* ---------- Boli team admin (part_admin) ---------- */
const AD_TABS = [['attn','Needs attention'],['deals','Deals'],['people','People'],['briefs','Briefs']];
const AD_STATUS = [['','All'],['applied','Applied'],['accepted','Accepted'],['sent','Video sent'],['approved','Approved'],['paid','Completed'],['declined','Declined']];
const AD_PEOPLE = [['all','All'],['creator','Creators'],['brand','Brands'],['suspended','Suspended'],['unverified','Unverified creators']];
const AD_COMP = {pay:'Payment', product:'Product only', both:'Product + payment'};

const adDate = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '';
const adTime = d => d ? new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}) : '';
const adToday = () => new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
const adMs = d => d ? new Date(d).getTime() : 0;
const adLast = d => Math.max(adMs(d.updated_at), adMs(d.last_msg_at), adMs(d.created_at));
const adDays = ms => Math.floor((Date.now() - ms) / 864e5);
const adStatus = d => ({applied:'Applied', accepted:'Accepted, shooting', sent:'Video sent', approved:'Approved', declined:'Declined', paid:d.comp==='product'?'Completed':'Paid'}[d.status] || d.status);
const adGets = b => b.type==='affiliate' ? 'Commission' : b.comp==='product' ? 'Product only' : b.comp==='both' ? rs(b.pay)+' + product' : rs(b.pay);
const adBriefStatus = b => b.status!=='open' ? 'Closed' : (b.closes_on && b.closes_on < adToday()) ? 'Expired' : 'Open';
const adLink = u => /^https?:\/\//i.test(u||'') ? u : '';

function adReasons(d){
  const r = [];
  if(d.help_at) r.push('Asked for help');
  if(['applied','accepted','sent'].includes(d.status)){ const n = adDays(adLast(d)); if(Date.now()-adLast(d) >= 48*36e5) r.push('Quiet for '+n+' day'+(n===1?'':'s')); }
  if(d.status==='approved'){ const t = adMs(d.updated_at) || adMs(d.created_at); if(Date.now()-t >= 3*864e5) r.push('Approved, not marked '+(d.comp==='product'?'completed':'paid')); }
  if((d.masked_count||0) >= 2) r.push('Tried to share contact details '+d.masked_count+' times');
  return r;
}

async function adLoad(){
  const [users, deals, briefs, lc] = await Promise.all([q(sb.rpc('admin_users')), q(sb.rpc('admin_deals')), q(sb.rpc('admin_briefs')),
    sb.rpc('launch_counts').then(r=>r.error?null:r.data, ()=>null), loadWork()]);
  const old = S.adm || {};
  S.adm = {tab:old.tab||'attn', dstat:old.dstat||'', pf:old.pf||'all', pq:old.pq||'', confirm:null, fol:null,
    users:users||[], deals:deals||[], briefs:briefs||[], launch:lc||null, lconf:null, loadedAt:new Date()};
}
async function openAdmin(){
  if(!(S.me && S.me.is_admin)) return go('home');
  try{ await adLoad(); }
  catch(e){ if(!S.adm) S.adm = {tab:'attn', dstat:'', pf:'all', pq:'', confirm:null, fol:null, users:[], deals:[], briefs:[], loadedAt:null, err:e.message||'Could not load.'}; else S.adm.err = e.message||'Could not load.'; }
  S.view = 'admin'; S.arg = null; render();
}
async function adReload(msg){ await adLoad(); render(); if(msg) toast(msg); }

function adLaunch(){
  const A = S.adm; if(!A || !S.hasSettings) return '';
  const open = S.workOpen!==false, c = A.launch || null, n = v => num(v||0);
  const tiles = c ? [[c.creators,'Creators'],[c.creators_with_sample,'With a sample or page link'],[c.creators_public,'Public profiles'],[c.creators_verified,'Verified'],[c.brands,'Brands'],[c.draft_briefs,'Draft briefs']] : [];
  const acts = A.lconf ? `<span class="meta">${A.lconf==='open'?'Open Boli for work? Draft briefs go live and creators can apply.':'Close for work? New briefs become drafts and nobody can apply, invite or accept.'}</span><button class="btn accent" data-act="ad-launch-yes">${A.lconf==='open'?'Yes, open now':'Yes, close'}</button><button class="pill" data-act="ad-launch-no">Cancel</button>`
    : open ? `<button class="pill" data-act="ad-launch" data-v="close">Close for work</button>` : `<button class="btn accent" data-act="ad-launch" data-v="open">Open Boli for work</button>`;
  return `<div class="panel" id="adLaunch"><div class="row" style="flex-wrap:wrap;gap:6px 12px"><b>Launch</b><span class="tag${open?' ok':''}">${open?'Open for work':'Closed for work — sign-ups only'}</span></div>
    ${tiles.length?`<div class="ad-tiles">${tiles.map(([v,t])=>`<div class="ad-tile"><b>${n(v)}</b><span>${t}</span></div>`).join('')}</div>`:''}
    <div class="ad-acts" style="flex-wrap:wrap">${acts}</div></div>`;
}
function adDealRow(d, reasons){
  return `<div class="ad-row">
    <div><b>${esc(d.brand_name)} ↔ ${esc(d.creator_name)}</b><br><span class="meta">${esc(d.brief_title)}</span></div>
    <div class="ad-tags"><span class="tag ok">${esc(adStatus(d))}</span>${(reasons||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
    <span class="meta">Started ${adDate(d.created_at)} · last activity ${adTime(new Date(adLast(d)))} · ${num(d.msg_count)} message${d.msg_count===1?'':'s'}</span>
    <div class="ad-acts"><button class="pill" data-act="ad-thread" data-v="${esc(d.id)}">Open messages</button>${d.help_at?`<button class="pill" data-act="ad-resolve" data-v="${esc(d.id)}">Mark help as resolved</button>`:''}</div>
  </div>`;
}

function adAttn(){
  const A = S.adm;
  const rows = A.deals.map(d=>({d, r:adReasons(d)})).filter(x=>x.r.length).sort((x,y)=>(y.d.help_at?1:0)-(x.d.help_at?1:0) || adLast(x.d)-adLast(y.d));
  const subs = A.users.filter(u=>u.role==='brand' && u.plan_requested_at && u.plan!=='sub');
  if(!rows.length && !subs.length) return `<div class="panel"><p class="meta">Nothing needs attention right now.</p></div>`;
  return `${rows.length?`<div class="panel"><h3>Deals to look at</h3><div class="ad-list">${rows.map(x=>adDealRow(x.d, x.r)).join('')}</div></div>`:''}
    ${subs.length?`<div class="panel"><h3>Asked for the subscription plan</h3><div class="ad-list">${subs.map(u=>`<div class="ad-row"><div><b>${esc(u.name)}</b><br><span class="meta">${esc(u.email||'')} · asked on ${adDate(u.plan_requested_at)}</span></div></div>`).join('')}</div></div>`:''}`;
}

function adDeals(){
  const A = S.adm;
  const list = A.deals.filter(d=>!A.dstat || d.status===A.dstat).sort((x,y)=>adLast(y)-adLast(x));
  return `<div class="chips" style="flex-wrap:wrap;overflow:visible">${AD_STATUS.map(([k,t])=>`<button class="pill" data-act="ad-dstat" data-v="${k}" aria-pressed="${A.dstat===k}">${t}</button>`).join('')}</div>
    <p class="meta">${list.length} deal${list.length===1?'':'s'}</p>
    <div class="panel"><div class="ad-list">${list.map(d=>adDealRow(d, adReasons(d))).join('') || '<p class="meta">No deals here yet.</p>'}</div></div>`;
}

function adPeopleList(){
  const A = S.adm, s = (A.pq||'').trim().toLowerCase();
  const list = A.users.filter(u => (A.pf==='all' || (A.pf==='creator'&&u.role==='creator') || (A.pf==='brand'&&u.role==='brand') || (A.pf==='suspended'&&u.suspended) || (A.pf==='unverified'&&u.role==='creator'&&!u.verified))
      && (!s || ((u.name||'')+' '+(u.email||'')).toLowerCase().includes(s)))
    .sort((x,y)=>adMs(y.created_at)-adMs(x.created_at));
  return `<p class="meta">${list.length} ${list.length===1?'person':'people'}</p>
    <div class="panel"><div class="ad-list">${list.map(adPerson).join('') || '<p class="meta">Nobody matches.</p>'}</div></div>`;
}
function adPerson(u){
  const A = S.adm, me = S.user && u.id===S.user.id, cr = u.role==='creator';
  const soc = adLink(u.social), sm = adLink(u.sample_link), site = adLink(u.site);
  const facts = [cr?'Creator':'Brand', u.city, cr?num(u.followers)+' followers':'', 'Joined '+adDate(u.created_at)].filter(Boolean).join(' · ');
  return `<div class="ad-row">
    <div><b>${esc(u.name||'No profile yet')}</b>${me?' <span class="meta">(you)</span>':''}<br><span class="meta">${esc(u.email||'')}</span><br><span class="meta">${esc(facts)}</span></div>
    <div class="ad-tags">${u.confirmed?'':'<span class="tag">Email not confirmed</span>'}${u.verified?'<span class="tag ok">Verified</span>':''}${u.suspended?'<span class="tag">Suspended</span>':''}${u.plan==='sub'?'<span class="tag ok">Subscription</span>':''}</div>
    <div class="ad-acts">
      ${soc?`<a class="pill" href="${esc(soc)}" target="_blank" rel="noopener">Their page</a>`:''}${sm?`<a class="pill" href="${esc(sm)}" target="_blank" rel="noopener">Sample video</a>`:''}${site?`<a class="pill" href="${esc(site)}" target="_blank" rel="noopener">Website</a>`:''}
      ${cr?`<button class="pill" data-act="ad-verify" data-v="${esc(u.id)}" data-on="${u.verified?'0':'1'}">${u.verified?'Remove verification':'Verify'}</button>`:''}
      ${cr?`<button class="pill" data-act="ad-fol" data-v="${esc(u.id)}" aria-pressed="${A.fol===u.id}">Correct followers</button>`:''}
      ${u.suspended?`<button class="pill" data-act="ad-unsuspend" data-v="${esc(u.id)}">Lift suspension</button>`:me?'':`<button class="pill" data-act="ad-suspend" data-v="${esc(u.id)}">Suspend</button>`}
    </div>
    ${A.fol===u.id?`<div class="ad-inline"><input id="adFol" type="number" min="0" step="1" value="${Number(u.followers)||0}" aria-label="Follower count for ${esc(u.name)}"><button class="pill" data-act="ad-folsave" data-v="${esc(u.id)}" aria-pressed="true">Save</button><button class="link" data-act="ad-cancel">Cancel</button></div>`:''}
    ${A.confirm===u.id?`<div class="lock"><b>Suspend this account?</b><span class="meta">${esc(u.name||u.email||'This person')} will not be able to post briefs, apply or send messages until you lift the suspension.</span><div class="ad-acts"><button class="pill" data-act="ad-suspend-yes" data-v="${esc(u.id)}" aria-pressed="true">Yes, suspend</button><button class="link" data-act="ad-cancel">Cancel</button></div></div>`:''}
  </div>`;
}
function adPeople(){
  const A = S.adm;
  return `<input class="ad-search" id="adQ" type="search" value="${esc(A.pq)}" placeholder="Search by name or email" aria-label="Search people">
    <div class="chips" style="flex-wrap:wrap;overflow:visible">${AD_PEOPLE.map(([k,t])=>`<button class="pill" data-act="ad-pf" data-v="${k}" aria-pressed="${A.pf===k}">${t}</button>`).join('')}</div>
    <div class="sec" id="adPeople">${adPeopleList()}</div>`;
}

function adBriefs(){
  const list = [...S.adm.briefs].sort((x,y)=>adMs(y.created_at)-adMs(x.created_at));
  return `<p class="meta">${list.length} brief${list.length===1?'':'s'}</p>
    <div class="panel"><div class="ad-list">${list.map(b=>{ const st = adBriefStatus(b); return `<div class="ad-row">
      <div><b>${esc(b.title)}</b><br><span class="meta">${esc(b.brand_name)} · ${esc(TYPES[b.type]||b.type)} · ${esc(adGets(b))}</span></div>
      <div class="ad-tags"><span class="tag${st==='Open'?' ok':''}">${st}</span><span class="meta">${num(b.applicants)} applicant${b.applicants===1?'':'s'} · wants ${num(b.creators_needed)} · posted ${adDate(b.created_at)}${b.closes_on?' · closes '+adDate(b.closes_on+'T12:00:00'):''}</span></div>
      <div class="ad-acts"><button class="pill" data-act="ad-brief" data-v="${esc(b.id)}">Open brief page</button></div>
    </div>`; }).join('') || '<p class="meta">No briefs yet.</p>'}</div></div>`;
}

function vAdmin(){
  const A = S.adm;
  if(!A) return `<p class="meta">Loading…</p>`;
  const U = A.users, D = A.deals, wk = Date.now() - 7*864e5;
  const attn = D.filter(d=>adReasons(d).length).length + U.filter(u=>u.role==='brand'&&u.plan_requested_at&&u.plan!=='sub').length;
  const tiles = [
    [U.filter(u=>u.role==='creator').length, 'Creators'],
    [U.filter(u=>u.role==='brand').length, 'Brands'],
    [A.briefs.filter(b=>adBriefStatus(b)==='Open').length, 'Open briefs'],
    [D.filter(d=>['accepted','sent','approved'].includes(d.status)).length, 'Active deals'],
    [D.filter(d=>d.status==='paid').length, 'Completed deals'],
    [U.filter(u=>adMs(u.created_at)>=wk).length, 'Sign-ups in the last 7 days'],
    [U.filter(u=>!u.confirmed).length, 'Emails not confirmed', 1],
    [U.filter(u=>u.plan_requested_at&&u.plan!=='sub').length, 'Subscription requests', 1]];
  const body = A.tab==='deals' ? adDeals() : A.tab==='people' ? adPeople() : A.tab==='briefs' ? adBriefs() : adAttn();
  return `<div class="sec">
    <div class="ad-top"><div><span class="eyebrow">Boli team</span><h1 style="font-size:clamp(1.8rem,5vw,2.4rem)">Overview</h1></div>
      <div class="ad-acts"><span class="meta">${A.loadedAt?'Updated '+adTime(A.loadedAt):''}</span><button class="pill" data-act="ad-refresh">Refresh</button></div></div>
    ${A.err?`<p class="meta">Could not load the latest data: ${esc(A.err)}</p>`:''}
    ${adLaunch()}
    <div class="ad-tiles">${tiles.map(([n,t,w])=>`<div class="ad-tile${w&&n?' warn':''}"><b>${num(n)}</b><span>${t}</span></div>`).join('')}</div>
    <div class="chips" style="flex-wrap:wrap;overflow:visible" role="tablist" aria-label="Boli team sections">${AD_TABS.map(([k,t])=>`<button class="pill" role="tab" data-act="ad-tab" data-v="${k}" aria-selected="${A.tab===k}" aria-pressed="${A.tab===k}">${t}${k==='attn'&&attn?' · '+attn:''}</button>`).join('')}</div>
    ${body}
  </div>`;
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act^="ad-"]'); if(!el || el.disabled || !S.adm) return;
  const a = el.dataset.act, v = el.dataset.v, A = S.adm;
  const keep = fn => { const y = window.scrollY; fn(); render(); window.scrollTo(0, y); };
  if(a==='ad-launch') return keep(()=>{ A.lconf = v==='open' ? 'open' : 'close'; });
  if(a==='ad-launch-no') return keep(()=>{ A.lconf = null; });
  if(a==='ad-launch-yes') return run(async()=>{
    const want = A.lconf==='open'; el.disabled = true;
    const r = await q(sb.rpc('admin_set_work_open', {p_open: want}));
    S.workOpen = want; A.lconf = null;
    const n = r && r.published!=null ? Number(r.published) : 0;
    await loadAll(); await adReload(want ? 'Boli is open. '+n+' draft brief'+(n===1?' is':'s are')+' now live.' : 'Boli is closed for work.');
  });
  if(a==='ad-tab') return keep(()=>{ A.tab = v; A.confirm = null; A.fol = null; });
  if(a==='ad-dstat') return keep(()=>{ A.dstat = v; });
  if(a==='ad-pf') return keep(()=>{ A.pf = v; A.confirm = null; A.fol = null; });
  if(a==='ad-cancel') return keep(()=>{ A.confirm = null; A.fol = null; });
  if(a==='ad-suspend') return keep(()=>{ A.confirm = v; A.fol = null; });
  if(a==='ad-fol') return keep(()=>{ A.fol = A.fol===v ? null : v; A.confirm = null; });
  if(a==='ad-thread') return go('thread', v);
  if(a==='ad-brief') return go('brief', v);
  if(a==='ad-refresh') return run(async()=>{ el.disabled = true; delete A.err; await adReload('Updated'); });
  if(a==='ad-resolve') return run(async()=>{ await q(sb.rpc('admin_resolve_help', {app:v})); await adReload('Marked as resolved'); });
  if(a==='ad-verify') return run(async()=>{ const on = el.dataset.on==='1'; await q(sb.rpc('admin_set', {uid:v, p_suspended:null, p_verified:on, p_followers:null})); await adReload(on?'Creator verified':'Verification removed'); });
  if(a==='ad-suspend-yes') return run(async()=>{ if(S.user && v===S.user.id) return toast('You cannot suspend your own account.'); await q(sb.rpc('admin_set', {uid:v, p_suspended:true, p_verified:null, p_followers:null})); await adReload('Account suspended'); });
  if(a==='ad-unsuspend') return run(async()=>{ await q(sb.rpc('admin_set', {uid:v, p_suspended:false, p_verified:null, p_followers:null})); await adReload('Suspension lifted'); });
  if(a==='ad-folsave') return run(async()=>{ const raw = ($('adFol')||{}).value, n = parseInt(raw, 10); if(!(n >= 0)) return toast('Enter a follower count of 0 or more.'); await q(sb.rpc('admin_set', {uid:v, p_suspended:null, p_verified:null, p_followers:n})); await adReload('Follower count corrected'); });
});
document.addEventListener('input', e=>{
  if(e.target.id!=='adQ' || !S.adm) return;
  S.adm.pq = e.target.value; S.adm.confirm = null; S.adm.fol = null;
  const box = $('adPeople'); if(box) box.innerHTML = adPeopleList();
});

<script>
/* ---------- Find creators, creator profile, invites (part_find) ---------- */
function fcState(){ if(!S.fc) S.fc = {q:'', local:false}; return S.fc; }
function fInvOn(){ return S.workOpen!==false && !(S.cap && S.cap.invites===false); }
function fInvites(){ return Array.isArray(S.invites) ? S.invites : []; }
function fPlace(c){ return [c.city, c.area].map(x=>String(x||'').trim()).filter(Boolean).join(' · '); }
function fOpenBriefs(){ return (S.mine||[]).filter(b=>b.status==='open' && !expired(b)); }
function fBriefState(b, cid){
  const apps = b.applications || [];
  if(apps.some(a=>a.creator_id===cid)) return 'applied';
  if(fInvites().some(i=>i.brief_id===b.id && i.creator_id===cid)) return 'invited';
  if(apps.filter(a=>ACTIVE.includes(a.status)).length >= (b.creators_needed||1)) return 'full';
  return 'invite';
}
function fList(){
  const st = fcState(), s = st.q.trim().toLowerCase(), lang = S.lang || '';
  return clist().filter(c =>
    (!lang || (c.langs||[]).includes(lang)) &&
    (!st.local || String(c.local_focus||'').trim()) &&
    (!s || [c.name, c.city, c.area, c.local_focus].map(x=>String(x||'').toLowerCase()).join(' ').includes(s)));
}
function fCard(c){
  const bio = String(c.bio||'').trim(), local = String(c.local_focus||'').trim(), place = fPlace(c);
  const line = [place, (c.langs||[]).join(', '), (c.cats||[]).map(k=>CATS[k]||k).join(', ')].filter(Boolean).map(esc).join(' · ');
  const canInvite = isBrand() && fInvOn();
  return `<div class="person f-card t-${hue((c.cats||[])[0])}"><span class="av">${esc(ini(c.name))}</span>
    <div><button class="bc-t" data-act="f-open" data-v="${esc(c.id)}" style="text-align:left">${esc(c.name)}</button>${vtag(c)}<br>
      <span class="meta">${line}</span><br>
      <span class="meta">${num(c.followers)} followers${c.rate?' · usually '+rs(c.rate):''} · ${esc(rec(c.id))}</span>
      ${local?`<div class="f-tags"><span class="tag">Local page: ${esc(local)}</span></div>`:''}
      ${bio?`<p class="meta f-bio">${esc(bio.length>120?bio.slice(0,120).trimEnd()+'…':bio)}</p>`:''}
    </div>
    <div class="f-acts"><button class="pill" data-act="f-open" data-v="${esc(c.id)}">View profile</button>${canInvite?`<button class="pill" data-act="f-quick" data-v="${esc(c.id)}" aria-pressed="true">Invite</button>`:''}</div></div>`;
}
function fListHTML(){
  const list = fList();
  return `<p class="meta" id="fCount">${list.length} creator${list.length===1?'':'s'}${S.lang?' creating in '+esc(S.lang):''}. Follower counts are entered by creators unless marked Verified.</p>
    <div>${list.map(fCard).join('') || '<div class="panel"><p class="meta">No creators match. Try clearing the search, the Local pages filter or the other filters.</p><div><button class="btn" data-act="f-clear">Clear search and filters</button></div></div>'}</div>`;
}
function vFind(){
  const st = fcState();
  return `<div class="sec"><span class="eyebrow">Find creators</span><h1 style="font-size:clamp(1.8rem,5vw,2.4rem)">Creators on Boli</h1>
  <div class="f-top"><input class="f-search" id="fQ" type="search" value="${esc(st.q)}" placeholder="Search by name, city, area or place" aria-label="Search creators">
    <button class="pill" data-act="f-local" aria-pressed="${!!st.local}">Local pages only</button></div>
  ${fbar('c')}
  <div id="fList">${fListHTML()}</div>
  <p class="meta">Open a profile to see a creator’s sample video${fInvOn()?' and invite them to one of your briefs':''}. Their page link is shared once you accept their application.</p></div>`;
}

function vCreator(){
  const st = S.cr || {}, c = st.c, admin = !isBrand() && S.me && S.me.is_admin;
  const back = `<button class="link" data-act="nav" data-v="${admin?'admin':'find'}">‹ ${admin?'Back to Boli team':'All creators'}</button>`;
  if(!c) return `<div class="sec" style="max-width:640px;margin:0 auto;width:100%">${back}<p class="meta">This creator’s profile is not available.</p></div>`;
  const local = String(c.local_focus||'').trim(), bio = String(c.bio||'').trim(), place = fPlace(c), sample = url(st.sample);
  const deals = (c.deals||[]).map(k=>TYPES[k]||k).join(', ');
  const kv = (k, v) => v ? `<div class="kv"><span>${k}</span><span>${v}</span></div>` : '';
  let invite = '';
  if(isBrand() && fInvOn()){
    const open = fOpenBriefs();
    invite = `<div class="panel" id="fInv"><h3>Invite to a brief</h3>${open.length ? open.map(b=>{
        const s = fBriefState(b, c.id);
        const right = s==='invite' ? `<button class="pill" data-act="f-invite" data-v="${esc(b.id)}" data-c="${esc(c.id)}" aria-pressed="true">Invite</button>`
          : `<span class="tag${s==='full'?'':' ok'}">${{invited:'Invited', applied:'Already applied', full:'Brief is full'}[s]}</span>`;
        return `<div class="f-inv"><span><b>${esc(b.title)}</b><br><span class="meta">${esc(payLabel(b))} · ${esc(TYPES[b.type]||'')}</span></span>${right}</div>`;
      }).join('') + '<p class="meta">The creator gets an email and sees the invitation on Boli. They still choose whether to apply.</p>'
      : `<p class="meta">Post a brief first, then invite creators to it.</p><div><button class="btn accent" data-act="nav" data-v="dash">Go to dashboard</button></div>`}</div>`;
  }
  return `<div class="sec f-prof" style="max-width:640px;margin:0 auto;width:100%">${back}
    <div class="f-head t-${hue((c.cats||[])[0])}"><span class="av">${esc(ini(c.name))}</span><div style="flex:1;min-width:0"><span class="eyebrow">Creator</span><h1 style="font-size:clamp(1.6rem,5vw,2.2rem)">${esc(c.name)}${vtag(c)}</h1></div></div>
    ${local?`<div class="f-tags"><span class="tag">Local page: ${esc(local)}</span></div>`:''}
    ${bio?`<p style="overflow-wrap:anywhere">${esc(bio)}</p>`:''}
    <div class="panel">
      ${kv('Location', esc(place))}
      ${kv('Languages', esc((c.langs||[]).join(', ')))}
      ${kv('Makes', esc((c.cats||[]).map(k=>CATS[k]||k).join(', ')))}
      ${kv('Open to', esc(deals))}
      ${kv('Followers', num(c.followers) + (c.verified ? '' : ' <span class="meta">(entered by the creator)</span>'))}
      ${kv('Usual rate', c.rate ? rs(c.rate)+' a video' : '')}
      ${kv('Track record', esc(rec(c.id)))}
      ${sample?`<div><a class="btn" href="${esc(sample)}" target="_blank" rel="noopener">Watch sample video</a></div>`:(st.loading?'<p class="meta">Loading…</p>':'<p class="meta">This creator has not added a sample video.</p>')}
      <p class="meta">Their page link is shared with you once you accept their application.</p>
    </div>
    ${invite}</div>`;
}

async function openCreator(id){
  const admin = !!(S.me && S.me.is_admin);
  if(!S.me || !(isBrand() || admin)) return go('home');
  S.cr = {id, c:(S.creators||[]).find(x=>x.id===id) || null, sample:null, loading:true, toInvite: !!(S.cr && S.cr.toInvite && S.cr.id===id)};
  S.view = 'creator'; S.arg = id; render(); window.scrollTo(0,0);
  const st = S.cr;
  try{
    if(!st.c){
      const cols = typeof PSEL!=='undefined' ? PSEL : PCOLS;
      const p = await q(sb.from('profiles').select(cols).eq('id', id).maybeSingle());
      st.c = p && p.role==='creator' ? p : null;
    }
    if(st.c){
      const r = await sb.rpc('creator_card', {uid:id});
      st.sample = !r.error && r.data && r.data[0] ? r.data[0].sample_link : null;
    }
  }catch(e){ toast(e.message || 'Something went wrong. Please try again.'); }
  st.loading = false;
  if(S.cr!==st || S.view!=='creator') return;
  render();
  if(st.toInvite){ st.toInvite = false; const el = $('fInv'); if(el) el.scrollIntoView({block:'start'}); }
}

async function fInvite(briefId, creatorId){
  await q(sb.from('invites').insert({brief_id:briefId, creator_id:creatorId}));
  if(!Array.isArray(S.invites)) S.invites = [];
  S.invites.push({brief_id:briefId, creator_id:creatorId, created_at:new Date().toISOString()});
  const y = window.scrollY; render(); window.scrollTo(0, y); toast('Invitation sent');
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act^="f-"]'); if(!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if(a==='f-open') return go('creator', v);
  if(a==='f-local'){ const st = fcState(); st.local = !st.local; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if(a==='f-clear'){ const st = fcState(); st.q = ''; st.local = false; ['ccat','ccity','clang','cfol','csort'].forEach(f=>{ if(typeof DEF!=='undefined' && f in DEF) S.flt[f] = DEF[f]; }); render(); return; }
  if(a==='f-invite') return run(()=>fInvite(v, el.dataset.c));
  if(a==='f-quick'){
    if(!isBrand() || !fInvOn()) return;
    const can = fOpenBriefs().filter(b=>fBriefState(b, v)==='invite');
    if(can.length===1) return run(()=>fInvite(can[0].id, v));
    S.cr = {id:v, toInvite:true};
    return go('creator', v);
  }
});
document.addEventListener('input', e=>{
  if(e.target.id!=='fQ') return;
  fcState().q = e.target.value;
  const box = $('fList'); if(box) box.innerHTML = fListHTML();
});
</script>
