.f-prof .kv span:last-child{overflow-wrap:anywhere;min-width:0}
@media (max-width:520px){.f-card .f-acts{padding-left:0}}
</style>
<script>
/* ---------- Find creators, creator profile, invites (part_find) ---------- */
function fcState(){ if(!S.fc) S.fc = {q:'', local:false}; return S.fc; }
function fInvOn(){ return !(S.cap && S.cap.invites===false); }
function fInvites(){ return Array.isArray(S.invites) ? S.invites : []; }
function fPlace(c){ return [c.city, c.area].map(x=>String(x||'').trim()).filter(Boolean).join(' · '); }
function fOpenBriefs(){ return (S.mine||[]).filter(b=>b.status==='open' && !expired(b)); }
function fBriefState(b, cid){
  const apps = b.applications || [];
  if(apps.some(a=>a.creator_id===cid)) return 'applied';
  if(fInvites().some(i=>i.brief_id===b.id && i.creator_id===cid)) return 'invited';
  if(apps.filter(a=>ACTIVE.includes(a.status)).length >= (b.creators_needed||1)) return 'full';
  return 'invite';
}
function fList(){
  const st = fcState(), s = st.q.trim().toLowerCase(), lang = S.lang || '';
  return clist().filter(c =>
    (!lang || (c.langs||[]).includes(lang)) &&
    (!st.local || String(c.local_focus||'').trim()) &&
    (!s || [c.name, c.city, c.area, c.local_focus].map(x=>String(x||'').toLowerCase()).join(' ').includes(s)));
}
function fCard(c){
  const bio = String(c.bio||'').trim(), local = String(c.local_focus||'').trim(), place = fPlace(c);
  const line = [place, (c.langs||[]).join(', '), (c.cats||[]).map(k=>CATS[k]||k).join(', ')].filter(Boolean).map(esc).join(' · ');
  const canInvite = isBrand() && fInvOn();
  return `<div class="person f-card t-${hue((c.cats||[])[0])}"><span class="av">${esc(ini(c.name))}</span>
    <div><button class="bc-t" data-act="f-open" data-v="${esc(c.id)}" style="text-align:left">${esc(c.name)}</button>${vtag(c)}<br>
      <span class="meta">${line}</span><br>
      <span class="meta">${num(c.followers)} followers${c.rate?' · usually '+rs(c.rate):''} · ${esc(rec(c.id))}</span>
      ${local?`<div class="f-tags"><span class="tag">Local page: ${esc(local)}</span></div>`:''}
      ${bio?`<p class="meta f-bio">${esc(bio.length>120?bio.slice(0,120).trimEnd()+'…':bio)}</p>`:''}
    </div>
    <div class="f-acts"><button class="pill" data-act="f-open" data-v="${esc(c.id)}">View profile</button>${canInvite?`<button class="pill" data-act="f-quick" data-v="${esc(c.id)}" aria-pressed="true">Invite</button>`:''}</div></div>`;
}
function fListHTML(){
  const list = fList();
  return `<p class="meta" id="fCount">${list.length} creator${list.length===1?'':'s'}${S.lang?' creating in '+esc(S.lang):''}. Follower counts are entered by creators unless marked Verified.</p>
    <div>${list.map(fCard).join('') || '<div class="panel"><p class="meta">No creators match. Try clearing the search, the Local pages filter or the other filters.</p><div><button class="btn" data-act="f-clear">Clear search and filters</button></div></div>'}</div>`;
}
function vFind(){
  const st = fcState();
  return `<div class="sec"><span class="eyebrow">Find creators</span><h1 style="font-size:clamp(1.8rem,5vw,2.4rem)">Creators on Boli</h1>
  <div class="f-top"><input class="f-search" id="fQ" type="search" value="${esc(st.q)}" placeholder="Search by name, city, area or place" aria-label="Search creators">
    <button class="pill" data-act="f-local" aria-pressed="${!!st.local}">Local pages only</button></div>
  ${fbar('c')}
  <div id="fList">${fListHTML()}</div>
  <p class="meta">Open a profile to see a creator’s sample video${fInvOn()?' and invite them to one of your briefs':''}. Their page link is shared once you accept their application.</p></div>`;
}

function vCreator(){
  const st = S.cr || {}, c = st.c, admin = !isBrand() && S.me && S.me.is_admin;
  const back = `<button class="link" data-act="nav" data-v="${admin?'admin':'find'}">‹ ${admin?'Back to Boli team':'All creators'}</button>`;
  if(!c) return `<div class="sec" style="max-width:640px;margin:0 auto;width:100%">${back}<p class="meta">This creator’s profile is not available.</p></div>`;
  const local = String(c.local_focus||'').trim(), bio = String(c.bio||'').trim(), place = fPlace(c), sample = url(st.sample);
  const deals = (c.deals||[]).map(k=>TYPES[k]||k).join(', ');
  const kv = (k, v) => v ? `<div class="kv"><span>${k}</span><span>${v}</span></div>` : '';
  let invite = '';
  if(isBrand() && fInvOn()){
    const open = fOpenBriefs();
    invite = `<div class="panel" id="fInv"><h3>Invite to a brief</h3>${open.length ? open.map(b=>{
        const s = fBriefState(b, c.id);
        const right = s==='invite' ? `<button class="pill" data-act="f-invite" data-v="${esc(b.id)}" data-c="${esc(c.id)}" aria-pressed="true">Invite</button>`
          : `<span class="tag${s==='full'?'':' ok'}">${{invited:'Invited', applied:'Already applied', full:'Brief is full'}[s]}</span>`;
        return `<div class="f-inv"><span><b>${esc(b.title)}</b><br><span class="meta">${esc(payLabel(b))} · ${esc(TYPES[b.type]||'')}</span></span>${right}</div>`;
      }).join('') + '<p class="meta">The creator gets an email and sees the invitation on Boli. They still choose whether to apply.</p>'
      : `<p class="meta">Post a brief first, then invite creators to it.</p><div><button class="btn accent" data-act="nav" data-v="dash">Go to dashboard</button></div>`}</div>`;
  }
  return `<div class="sec f-prof" style="max-width:640px;margin:0 auto;width:100%">${back}
    <div class="f-head t-${hue((c.cats||[])[0])}"><span class="av">${esc(ini(c.name))}</span><div style="flex:1;min-width:0"><span class="eyebrow">Creator</span><h1 style="font-size:clamp(1.6rem,5vw,2.2rem)">${esc(c.name)}${vtag(c)}</h1></div></div>
    ${local?`<div class="f-tags"><span class="tag">Local page: ${esc(local)}</span></div>`:''}
    ${bio?`<p style="overflow-wrap:anywhere">${esc(bio)}</p>`:''}
    <div class="panel">
      ${kv('Location', esc(place))}
      ${kv('Languages', esc((c.langs||[]).join(', ')))}
      ${kv('Makes', esc((c.cats||[]).map(k=>CATS[k]||k).join(', ')))}
      ${kv('Open to', esc(deals))}
      ${kv('Followers', num(c.followers) + (c.verified ? '' : ' <span class="meta">(entered by the creator)</span>'))}
      ${kv('Usual rate', c.rate ? rs(c.rate)+' a video' : '')}
      ${kv('Track record', esc(rec(c.id)))}
      ${sample?`<div><a class="btn" href="${esc(sample)}" target="_blank" rel="noopener">Watch sample video</a></div>`:(st.loading?'<p class="meta">Loading…</p>':'<p class="meta">This creator has not added a sample video.</p>')}
      <p class="meta">Their page link is shared with you once you accept their application.</p>
    </div>
    ${invite}</div>`;
}

async function openCreator(id){
  const admin = !!(S.me && S.me.is_admin);
  if(!S.me || !(isBrand() || admin)) return go('home');
  S.cr = {id, c:(S.creators||[]).find(x=>x.id===id) || null, sample:null, loading:true, toInvite: !!(S.cr && S.cr.toInvite && S.cr.id===id)};
  S.view = 'creator'; S.arg = id; render(); window.scrollTo(0,0);
  const st = S.cr;
  try{
    if(!st.c){
      const cols = typeof PSEL!=='undefined' ? PSEL : PCOLS;
      const p = await q(sb.from('profiles').select(cols).eq('id', id).maybeSingle());
      st.c = p && p.role==='creator' ? p : null;
    }
    if(st.c){
      const r = await sb.rpc('creator_card', {uid:id});
      st.sample = !r.error && r.data && r.data[0] ? r.data[0].sample_link : null;
    }
  }catch(e){ toast(e.message || 'Something went wrong. Please try again.'); }
  st.loading = false;
  if(S.cr!==st || S.view!=='creator') return;
  render();
  if(st.toInvite){ st.toInvite = false; const el = $('fInv'); if(el) el.scrollIntoView({block:'start'}); }
}

async function fInvite(briefId, creatorId){
  await q(sb.from('invites').insert({brief_id:briefId, creator_id:creatorId}));
  if(!Array.isArray(S.invites)) S.invites = [];
  S.invites.push({brief_id:briefId, creator_id:creatorId, created_at:new Date().toISOString()});
  const y = window.scrollY; render(); window.scrollTo(0, y); toast('Invitation sent');
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act^="f-"]'); if(!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if(a==='f-open') return go('creator', v);
  if(a==='f-local'){ const st = fcState(); st.local = !st.local; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if(a==='f-clear'){ const st = fcState(); st.q = ''; st.local = false; ['ccat','ccity','clang','cfol','csort'].forEach(f=>{ if(typeof DEF!=='undefined' && f in DEF) S.flt[f] = DEF[f]; }); render(); return; }
  if(a==='f-invite') return run(()=>fInvite(v, el.dataset.c));
  if(a==='f-quick'){
    if(!isBrand() || !fInvOn()) return;
    const can = fOpenBriefs().filter(b=>fBriefState(b, v)==='invite');
    if(can.length===1) return run(()=>fInvite(can[0].id, v));
    S.cr = {id:v, toInvite:true};
    return go('creator', v);
  }
});
document.addEventListener('input', e=>{
  if(e.target.id!=='fQ') return;
  fcState().q = e.target.value;
  const box = $('fList'); if(box) box.innerHTML = fListHTML();
});
</script>

.k-tile small{font-size:.74rem;color:var(--muted)}
.k-tile.wide{grid-column:1/-1}
.k-tile.new b{font-size:1.25rem;color:var(--accent)}
.k-sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.k-sec h2{font-size:1.25rem;margin:0}
.k-samples{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.k-sample{background:var(--surface);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.k-thumb,.k-fb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--chip)}
.k-fb{display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--cover-ink);background:linear-gradient(150deg,var(--hue),color-mix(in oklab,var(--hue) 40%,var(--cover-deep)))}
.k-sbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.k-sbody b{overflow-wrap:anywhere}
.k-nums{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted)}
.k-nums strong{color:var(--ink);font-variant-numeric:tabular-nums}
.k-sbody a.pill{align-self:flex-start;text-decoration:none;color:inherit}
.k-chart{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.k-barrow{display:flex;flex-direction:column;gap:5px;min-width:0}
.k-barrow .k-lab{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;min-width:0}
.k-barrow .k-lab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.k-barrow .k-lab span:last-child{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.k-track{height:10px;border-radius:999px;background:var(--chip);overflow:hidden}
.k-fill{height:100%;border-radius:999px;background:var(--hue);min-width:4px}
.k-open{display:flex;flex-wrap:wrap;gap:8px}
.k-foot{text-align:center;padding:6px 0 2px}
@media (min-width:700px){
  .k-band{padding:34px 34px}
  .k-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .k-samples{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1000px){
  .k-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .k-tile.wide{grid-column:span 2}
}
@media print{
  header,.dock,.toast,.k-bar,.k-noprint,#fInv,#langs{display:none !important}
  body{background:#fff !important}
  .k-wrap{max-width:none}
  .k-band,.k-fb,.k-fill,.k-chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .k-tile,.k-sample,.k-chart{border:1px solid #ddd;break-inside:avoid}
  .k-sec{break-inside:avoid}
}
</style>
<script>
/* ---------- Creator report: public profile, in-app creator page (part_kit) ---------- */
function kArr(x){ return Array.isArray(x) ? x : []; }
function kStr(x){ return String(x==null ? '' : x).trim(); }
function kInt(x){ const n = Number(x); return x!=null && x!=='' && isFinite(n) && n>=0 ? Math.round(n) : null; }
function kObj(r){ let d = r && !r.error ? r.data : null; if(Array.isArray(d)) d = d[0]; return d && typeof d==='object' && d.id ? d : null; }
function kKey(k){ return kStr(k.handle) || kStr(k.id); }
function kLink(k){ return location.origin + '/#/c/' + encodeURIComponent(kKey(k)); }
function kFirst(name){ return kStr(name).split(/\s+/)[0] || 'this creator'; }
function kViewer(k){
  if(!S.user || !S.me) return 'visitor';
  if(k && S.me.id===k.id) return 'self';
  if(isBrand()) return 'brand';
  if(S.me.is_admin) return 'admin';
  return 'creator';
}
function kPlatform(u){
  let h = ''; try{ h = new URL(u).hostname.replace(/^www\./,'').toLowerCase(); }catch(e){}
  return /(^|\.)instagram\.com$/.test(h) ? 'Instagram' : /(^|\.)(youtube\.com|youtu\.be)$/.test(h) ? 'YouTube' : /(^|\.)drive\.google\.com$/.test(h) ? 'Google Drive' : 'Video';
}
function kYtId(u){
  try{
    const x = new URL(u), h = x.hostname.replace(/^www\./,'').toLowerCase(); let id = '';
    if(h==='youtu.be') id = x.pathname.split('/')[1] || '';
    else if(/(^|\.)youtube\.com$/.test(h)){ if(x.pathname.startsWith('/shorts/')) id = x.pathname.split('/')[2] || ''; else if(x.pathname==='/watch') id = x.searchParams.get('v') || ''; }
    return /^[A-Za-z0-9_-]{6,20}$/.test(id) ? id : '';
  }catch(e){ return ''; }
}
function kSamples(k){
  return kArr(k && k.samples).filter(s=>s && url(kStr(s.url)) && /^https?:\/\/[^\s"'<>`]+$/i.test(kStr(s.url))).slice(0, 6).map((s, i)=>({
    url: kStr(s.url), title: kStr(s.title) || 'Sample ' + (i+1), views: kInt(s.views), likes: kInt(s.likes)}));
}
/* Builds a report object from a plain profile row, for when the public_profile function is not available. */
function kFromProfile(c, sample){
  const st = (S.stats || {})[c.id] || {};
  return {id:c.id, handle:c.handle||null, name:c.name, city:c.city, area:c.area, local_focus:c.local_focus, langs:c.langs, cats:c.cats, deals:c.deals, bio:c.bio,
    followers:c.followers, verified:!!c.verified, rate:c.rate||null, show_rate:true, public_on:!!c.public_on, created_at:c.created_at,
    stats:{done:st.done||0, brands:st.brands||0, first_try:null, brand_cats:[]}, samples: url(sample) ? [{url:sample}] : []};
}
function kTile(big, label, small, cls){ return `<div class="k-tile${cls?' '+cls:''}"><b>${big}</b><span>${label}</span>${small?`<small>${small}</small>`:''}</div>`; }
function kitHTML(k, opts){
  if(!k || typeof k!=='object') return '';
  const cats = kArr(k.cats), langs = kArr(k.langs), deals = kArr(k.deals), st = k.stats && typeof k.stats==='object' ? k.stats : {};
  const place = [k.city, k.area].map(kStr).filter(Boolean).join(' · '), local = kStr(k.local_focus), bio = kStr(k.bio);
  const done = kInt(st.done) || 0, brands = kInt(st.brands) || 0, first = kInt(st.first_try), rate = kInt(k.rate);
  let since = ''; try{ const d = new Date(k.created_at); if(/^\d{4}-\d{2}-\d{2}/.test(kStr(k.created_at)) && !isNaN(d)) since = d.toLocaleDateString('en-IN', {month:'short', year:'numeric'}); }catch(e){}
  const tiles = [kTile(num(kInt(k.followers) || 0), 'Followers', k.verified ? 'Verified by Boli' : 'Entered by the creator')];
  if(done > 0){
    tiles.push(kTile(num(done), done===1 ? 'Deal completed on Boli' : 'Deals completed on Boli'));
    tiles.push(kTile(num(brands), brands===1 ? 'Brand worked with' : 'Brands worked with'));
    if(first!=null) tiles.push(kTile(Math.min(100, Math.round(first/done*100)) + '%', 'Approved first time', 'Videos accepted without changes'));
  } else tiles.push(kTile('New on Boli', 'No deals completed here yet', '', 'new'));
  if(rate) tiles.push(kTile(rs(rate), 'Usual rate for a video'));
  if(since) tiles.push(kTile(esc(since), 'Member since'));
  const bcats = kArr(st.brand_cats).map(c=>CATS[c]).filter(Boolean);
  const samples = kSamples(k), withViews = samples.filter(s=>s.views!=null), maxV = Math.max(1, ...withViews.map(s=>s.views));
  const sampleCard = s => { const yt = kYtId(s.url), plat = kPlatform(s.url);
    return `<div class="k-sample">${yt ? `<img class="k-thumb" data-kfb="${esc(plat)}" src="https://img.youtube.com/vi/${esc(yt)}/hqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="k-fb" aria-hidden="true">${esc(plat)}</div>`}
      <div class="k-sbody"><b>${esc(s.title)}</b><span class="meta">${esc(plat)}</span>
      ${s.views!=null || s.likes!=null ? `<div class="k-nums">${s.views!=null?`<span><strong>${num(s.views)}</strong> views</span>`:''}${s.likes!=null?`<span><strong>${num(s.likes)}</strong> likes</span>`:''}</div>`:''}
      <a class="pill" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Watch</a></div></div>`; };
  return `<article class="k-rep t-${hue(cats[0])}">
    <div class="k-band">
      <div class="k-id"><span class="k-av" aria-hidden="true">${esc(ini(k.name))}</span><div style="min-width:0"><h1>${esc(k.name)}</h1>${place?`<div class="k-sub">${esc(place)}</div>`:''}</div></div>
      <div class="k-chips">${k.verified?'<span class="k-chip solid">Verified</span>':''}${local?`<span class="k-chip solid">Local page: ${esc(local)}</span>`:''}${cats.map(c=>`<span class="k-chip">${esc(CATS[c]||c)}</span>`).join('')}${langs.map(l=>`<span class="k-chip">${esc(l)}</span>`).join('')}</div>
      ${bio?`<p class="k-bio">${esc(bio)}</p>`:''}
    </div>
    <div class="k-tiles">${tiles.join('')}</div>
    ${bcats.length?`<p class="meta">Has worked with brands in: ${esc(bcats.join(', '))}.</p>`:''}
    <section class="k-sec"><h2>Work samples</h2>
      ${samples.length ? `<div class="k-samples">${samples.map(sampleCard).join('')}</div>` : '<p class="meta">No samples added yet.</p>'}
      ${withViews.length>=2 ? `<div class="k-chart"><b>Views on these samples</b>${withViews.map(s=>`<div class="k-barrow"><div class="k-lab"><span>${esc(s.title)}</span><span>${num(s.views)}</span></div><div class="k-track"><div class="k-fill" style="width:${Math.max(2, Math.round(s.views/maxV*100))}%"></div></div></div>`).join('')}<span class="meta">Views and likes are entered by the creator.</span></div>`
        : (samples.some(s=>s.views!=null || s.likes!=null) ? '<p class="meta">Views and likes are entered by the creator.</p>' : '')}
    </section>
    ${deals.length?`<section class="k-sec"><h2>Open to</h2><div class="k-open">${deals.map(d=>`<span class="pill">${esc(TYPES[d]||d)}</span>`).join('')}</div></section>`:''}
    <p class="meta k-foot">Profile on Boli · boli.ourdreamwork.com</p>
  </article>`;
}

async function kShare(k){
  const link = kLink(k);
  if(navigator.share){ try{ await navigator.share({title:kStr(k.name) + ' on Boli', text:kStr(k.name) + ' is a creator on Boli.', url:link}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(link); toast('Link copied'); }
  catch(e){ const t = document.createElement('textarea'); t.value = link; t.setAttribute('readonly',''); t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); let done = false; try{ done = document.execCommand('copy'); }catch(_){} t.remove(); toast(done ? 'Link copied' : link); }
}

async function openKit(key){
  const st = S.kit = {key, k:null, loading:true, missing:false};
  S.view = 'c'; S.arg = key; render(); window.scrollTo(0,0);
  try{ st.k = kObj(await sb.rpc('public_profile', {p_key:String(key==null?'':key)})); }catch(e){ st.k = null; }
  st.loading = false; st.missing = !st.k;
  if(S.kit!==st || S.view!=='c') return;
  render();
}
function vKit(){
  const st = S.kit || {}, k = st.k, v = kViewer(k);
  const adminBack = S.me && S.me.is_admin && !isBrand() ? '<button class="link" data-act="nav" data-v="admin">‹ Back to Boli team</button>' : '';
  if(st.loading && !k) return `<div class="sec k-wrap">${adminBack}<p class="meta">Loading profile…</p></div>`;
  if(!k) return `<div class="sec k-wrap">${adminBack}<div class="panel"><h3>This profile is not available</h3><p class="meta">The creator may have turned it off.</p><div><button class="btn" data-act="home">See briefs on Boli</button></div></div></div>`;
  const share = '<button class="btn ghost" data-act="k-share">Share</button>';
  const cta = v==='visitor' ? `<button class="btn accent" data-act="k-work">Work with ${esc(kFirst(k.name))} on Boli</button>${share}<span class="meta">Boli connects brands with regional creators. Posting a brief is free.</span>`
    : v==='brand' ? `<button class="btn accent" data-act="k-invite">Invite to a brief</button>${share}`
    : v==='self' ? `${share}<button class="btn ghost" data-act="nav" data-v="profile">Edit profile</button><button class="btn ghost" data-act="nav" data-v="account">Manage link</button><span class="meta">${k.public_on===false ? 'Your public profile is off, so only you and brands on Boli can see this.' : 'This is what people see when you share your link.'}</span>`
    : share;
  return `<div class="sec k-wrap">${adminBack}<div class="k-bar">${cta}</div>${kitHTML(k, {viewer:v})}</div>`;
}

/* In-app creator page for brands and the Boli team: the same report, then the invite section. */
function kInviteHTML(c){
  if(!c || !isBrand() || !fInvOn()) return '';
  const open = fOpenBriefs();
  return `<div class="panel" id="fInv"><h3>Invite to a brief</h3>${open.length ? open.map(b=>{
      const s = fBriefState(b, c.id);
      const right = s==='invite' ? `<button class="pill" data-act="f-invite" data-v="${esc(b.id)}" data-c="${esc(c.id)}" aria-pressed="true">Invite</button>`
        : `<span class="tag${s==='full'?'':' ok'}">${{invited:'Invited', applied:'Already applied', full:'Brief is full'}[s]}</span>`;
      return `<div class="f-inv"><span><b>${esc(b.title)}</b><br><span class="meta">${esc(payLabel(b))} · ${esc(TYPES[b.type]||'')}</span></span>${right}</div>`;
    }).join('') + '<p class="meta">The creator gets an email and sees the invitation on Boli. They still choose whether to apply.</p>'
    : `<p class="meta">Post a brief first, then invite creators to it.</p><div><button class="btn accent" data-act="nav" data-v="dash">Go to dashboard</button></div>`}</div>`;
}
function vCreator(){
  const st = S.cr || {}, k = st.k, admin = !isBrand() && S.me && S.me.is_admin;
  const back = `<button class="link k-noprint" data-act="nav" data-v="${admin?'admin':'find'}">‹ ${admin?'Back to Boli team':'All creators'}</button>`;
  if(st.loading && !k) return `<div class="sec k-wrap">${back}<p class="meta">Loading profile…</p></div>`;
  if(!k) return `<div class="sec k-wrap">${back}<p class="meta">This creator’s profile is not available.</p></div>`;
  return `<div class="sec k-wrap f-prof">${back}${kitHTML(k, {viewer:admin?'admin':'brand'})}
    <div class="k-bar">${k.public_on ? '<button class="btn ghost" data-act="k-share">Share this profile</button>' : ''}<span class="meta">Their page link is shared with you once you accept their application.</span></div>
    ${kInviteHTML(k)}</div>`;
}
async function openCreator(id){
  const admin = !!(S.me && S.me.is_admin);
  if(!S.me || !(isBrand() || admin)) return go('home');
  const prev = S.cr, c0 = (S.creators||[]).find(x=>x.id===id) || null;
  const st = S.cr = {id, c:c0, k:c0 ? kFromProfile(c0, null) : null, loading:true, toInvite: !!(prev && prev.toInvite && prev.id===id)};
  S.view = 'creator'; S.arg = id; render(); window.scrollTo(0,0);
  try{
    let k = null;
    try{ k = kObj(await sb.rpc('public_profile', {p_key:String(id)})); }catch(e){ k = null; }
    if(!k){
      let c = st.c;
      if(!c){
        const cols = typeof PSEL!=='undefined' ? PSEL : PCOLS;
        const p = await q(sb.from('profiles').select(cols).eq('id', id).maybeSingle());
        c = p && p.role==='creator' ? p : null;
      }
      if(c){
        let sample = null;
        try{ const r = await sb.rpc('creator_card', {uid:id}); sample = !r.error && r.data && r.data[0] ? r.data[0].sample_link : null; }catch(e){}
        k = kFromProfile(c, sample);
      }
    }
    st.k = k;
  }catch(e){ toast(e.message || 'Something went wrong. Please try again.'); }
  st.loading = false;
  if(S.cr!==st || S.view!=='creator') return;
  render();
  if(st.toInvite){ st.toInvite = false; const el = $('fInv'); if(el) el.scrollIntoView({block:'start'}); }
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act^="k-"]'); if(!el || el.disabled) return;
  const a = el.dataset.act, k = S.view==='creator' ? (S.cr||{}).k : (S.kit||{}).k; if(!k) return;
  if(a==='k-share') return run(()=>kShare(k));
  if(a==='k-invite') return go('creator', k.id);
  if(a==='k-work'){ S.pendC = k.id; S.authRole = 'brand'; S.authMode = 'up'; return go('auth'); }
});
/* A thumbnail that fails to load is swapped for a plain labelled block. */
document.addEventListener('error', e=>{
  const img = e.target; if(!img || img.tagName!=='IMG' || !img.dataset || img.dataset.kfb==null) return;
  const d = document.createElement('div'); d.className = 'k-fb'; d.setAttribute('aria-hidden','true'); d.textContent = img.dataset.kfb || 'Video';
  img.replaceWith(d);
}, true);
</script>
